server:
  port: 8080
  # Cuscal calls the webhook base URL you register with them. Set a base path here if you need one,
  # e.g. /b2b/npp/payments/v4
  servlet:
    context-path: ""

spring:
  application:
    name: npp-payments-notification-stub

management:
  endpoints:
    web:
      exposure:
        include: health,info

stub:
  # true: every endpoint returns 200 with its success body, whatever the request headers say.
  # Set to false (or start with --stub.always-ok=false / env STUB_ALWAYS_OK=false) to enable
  # the x-traceId check and the x-stub-response-status error override.
  always-ok: true
  # reason_code returned by Receive Payment Initiation (RAPAIN). See MandatePaymentInitiationReason1Code.
  rapain-reason-code: ACCP
  # Make Payment (POST /{orgId}/payments/{paymentId}) answers 200 with no body, then after delay-ms
  # POSTs a payment status to {base-url}/{orgId}/payments/{paymentId}/status.
  status-callback:
    enabled: true
    base-url: http://localhost:4002
    delay-ms: 3000
    # transaction_status in the callback body, e.g. ACSC (settled) or RJCT (rejected)
    transaction-status: ACSC
    # transaction_status_reason_code, only sent when transaction-status is RJCT or PDNG
    reason-code: AC07
    # Used when the Make Payment body has no payment_information.instructed_amount / service_level
    instructed-amount: "6.36"
    service-level: sct.05
    # posting_flag: PSTG (posting within SLA), PSTY (posting delayed), PSTD (posted)
    posting-flag: PSTY
    # settlement_method_identification: OFFU (Off Us), CCOM (Cuscal Community), ONUS (On Us)
    settlement-method: OFFU
  # Only applies when always-ok is false. The spec marks x-traceId as required.
  require-trace-id: true

logging:
  file:
    name: logs/npp-stub.log
  level:
    root: INFO
    npp.calls: INFO
