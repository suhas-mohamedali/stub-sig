paths:
  '/{orgId}/payments/{paymentId}':
    post:
      tags:
        - Payments
      summary: Make Payment
      description: |-
        This API initiates the credit transfer request for making a domestic payment from one account to other account/PayID.

        BO services supported - SCT, CATSCT, X2P1*
        *PayTo payments and IFTI payments are now separate endpoints.*
        
        *Until Osko Harmonisation compliance mandates otherwise, X2P1 payments—where applicable—are supported via Make Payment v4 endpoint.

      operationId: post-orgId-make-payment
      parameters:
        - name: orgId
          in: path
          description: |-
            orgId is the BIC11 of the payer sending the payment instruction to Cuscal.

            [MaxLength=11]
            [pattern=^[A-Z0-9]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$]
          required: true
          style: simple
          schema:
            maxLength: 11
            type: string
            pattern: '^[A-Z0-9]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$'
            example: CUSCAU2SXXX
        - name: paymentId
          in: path
          description: |-
            Payment Transaction Identifier generated by the payer, must be same as the transaction_identification in the request body.

            Refer payment_information.transaction_identification for data format

            [MaxLength=35]
            [pattern=^[a-zA-Z0-9]{11}N\d{8}[A-Z0-9]{2}\d{12}[0-9A-Z]$]
          required: true
          style: simple
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]{11}N\d{8}[A-Z0-9]{2}\d{12}[0-9A-Z]$'
            example: CUSCAU2STSTN20240306582730177113540
        - $ref: '#/components/parameters/x-auditInfo-applicationId'
        - $ref: '#/components/parameters/x-auditInfo-endUserId'
        - $ref: '#/components/parameters/x-auditInfo-endUserSessionId'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-customerNumber'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-userId'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-authenticationMethod'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-channelType'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-ipAddress'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-deviceFingerprint'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-imeiNumber'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-branchTerminalNumber'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-browserAgent'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-geoLocation'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-fraudScore'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-torMode'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-cookies'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-vpn'
        - $ref: '#/components/parameters/x-auditInfo-auditNote'
        - $ref: '#/components/parameters/x-traceId'
        - $ref: '#/components/parameters/x-instruction-priority'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditTransferInitiationRequest1'
        required: true
      responses:
        '202':
          description: |-
            The request has been accepted for processing.
            No response body is returned.
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
          content: {}
        '400':
          description: <p>Bad Request</p><table><tr><td><b>Error Code</b></td><td><b>Error Message</b></td></tr><tr><td>CUS.API.100001</td><td>The request format is incomplete or invalid - &lt;Field Name&gt;</td></tr><tr><td>CUS.API.100002</td><td>Mandatory field/s missing - &lt;Field Name&gt;</td></tr><tr><td>CUS.API.100003</td><td>Rule Violation - &lt;description&gt;</td></tr><tr><td>CUS.API.100004</td><td>Fraud information headers are incomplete. All required fraud information fields must be included.</td></tr></table>
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '401':
          description: <p>Not Authorised</p><table><tr><td><b>Error Code</b></td><td><b>Error Message</b></td></tr><tr><td>CUS.API.100504</td><td>Authorisation failed for the requested operation - &lt;optional description&gt;</td></tr></table>
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '409':
          description: <p>Conflict</p><table><tr><td><b>Error Code</b></td><td><b>Error Message</b></td></tr><tr><td>CUS.API.100501</td><td>Duplicate request detected. The request matches a previously processed request.</td></tr></table>
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '429':
          description: Too Many Requests
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
        '500':
          description: Internal Server Error
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
        '503':
          description: <p>Service Unavailable</p><table><tr><td><b>Error Code</b></td><td><b>Error Message</b></td></tr><tr><td>CUS.API.200000</td><td>The request could not be processed at this time. Please retry later.</td></tr></table>
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
      deprecated: false
      x-stoplight:
        id: fx5qv6se83rav
    get:
      tags:
        - Payments
      summary: Get Payment
      description: Retrieve a payment using it's paymentId and transactionType
      operationId: get-orgId-payments-paymentId
      parameters:
        - name: orgId
          in: path
          description: orgId is the BIC11 of the payer sending the payment instruction to Cuscal. Please note this value will be provided by Cuscal as part of on-boarding.
          required: true
          style: simple
          schema:
            maxLength: 11
            type: string
            pattern: '^[A-Z0-9]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$'
            example: CUSCAU2SXXX
        - name: paymentId
          in: path
          description: Transaction ID of the payment
          required: true
          style: simple
          schema:
            maxLength: 35
            type: string
            example: CUSCAU2STSTN20240306582730177113540
        - $ref: '#/components/parameters/x-traceId'
        - $ref: '#/components/parameters/x-auditInfo-applicationId'
        - $ref: '#/components/parameters/x-auditInfo-endUserId'
        - name: transactionType
          in: query
          description: |-
            Allowed values:

            MAP - Make A Payment (Payment made as Payer)

            MAPR - Make A Payment Return (Payment Returned as Payer)

            RAP - Receive A Payment (Payment received as Payee)

            RAPR - Receive A Payment Return (Payment Return received as Payee)
          required: true
          style: form
          explode: true
          schema:
            maxLength: 4
            type: string
            example: MAP
      responses:
        '200':
          description: OK
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse1'
        '400':
          description: <p>Bad Request</p><table><tr><td><b>Error Code</b></td><td><b>Error Message</b></td></tr><tr><td>CUS.API.100001</td><td>The request format is incomplete or invalid - &lt;Field Name&gt;</td></tr><tr><td>CUS.API.100002</td><td>Mandatory field/s missing - &lt;Field Name&gt;</td></tr></table>
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '401':
          description: <p>Not Authorised</p><table><tr><td><b>Error Code</b></td><td><b>Error Message</b></td></tr><tr><td>CUS.API.100504</td><td>Authorisation failed for the requested operation - &lt;optional description&gt;</td></tr></table>
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '404':
          description: <p>Not Found</p><table><tr><td><b>Error Code</b></td><td><b>Error Message</b></td></tr><tr><td>CUS.API.100500</td><td>The referenced record is unavailable - &lt;description&gt;</td></tr></table>
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '408':
          description: <p>Request Timeout</p><table><tr><td><b>Error Code</b></td><td><b>Error Message</b></td></tr><tr><td>CUS.API.200001</td><td>The request has timed out. Please retry later.</td></tr></table>
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '429':
          description: Too Many Requests
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
        '500':
          description: Internal Server Error
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
        '503':
          description: <p>Service Unavailable</p><table><tr><td><b>Error Code</b></td><td><b>Error Message</b></td></tr><tr><td>CUS.API.200000</td><td>The request could not be processed at this time. Please retry later.</td></tr></table>
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
      deprecated: false
      x-stoplight:
        id: kjzbm9fi4ybno
