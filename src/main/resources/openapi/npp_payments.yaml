          maxLength: 140
          type: string
          description: PayID Identifier. Only used when payment is addressed to a PayID. The PayID must be resolved before initiating the payment.
          example: mrsmith@hotmailtest.com
        full_legal_account_name:
          maxLength: 140
          type: string
          description: Creditor name as registered for the PayID. Only used when payment is addressed to a PayID.
          example: Mr Smith
        party_reference:
          type: string
          description: Contains the Creditor Reference Information of the pacs.008
        merchant_category_code:
          type: string
          minLength: 4
          maxLength: 4
          example: '4900'
          description: 'Unique identification of an organisation, as assigned by an institution, using an identification scheme. If the mandate created by the Initiating Party has creditor_information.party_type = "ORGN" and mandate_purpose_code is one of ["OTHR", "PERS", "UTIL", "GAMP", "RETL"], the Merchant Category Code (MCC) MUST be provided by the Initiating Party. For all other mandate_purpose_code values, the Initiating Party MAY provide the MCC.'
        ultimate_party_merchant_category_code:
          type: string
          minLength: 4
          maxLength: 4
          example: '4900'
          description: 'Unique identification of an organisation, as assigned by an institution, using an identification scheme. If the mandate created by the Initiating Party has creditor_information.party_type = "ORGN"` and mandate_purpose_code is one of ["OTHR", "PERS", "UTIL", "GAMP", "RETL"], the Merchant Category Code (MCC) SHOULD be provided by the Initiating Party. For all other mandate_purpose_code values, the Initiating Party MAY provide the MCC.'
    GetMandateInformation1:
      title: GetMandateInformation1
      type: object
      properties:
        instruction_identification:
          maxLength: 35
          minLength: 35
          type: string
          description: |-
            Unique mandate payment instruction identification assigned by the instructing party.
            Must be populated for mandate payments
          example: BANKNTSTXXXN20180501000000000000010
        mandate_identification:
          pattern: '^[a-f0-9]{12}1[a-f0-9]{3}[89ab][a-f0-9]{15}$'
          type: string
          description: |-
            Mandate ID associated to the transaction.
            Must be populated for mandate payments
          example: 747db4e0774b11eba907b95df9422fde
        'initiating_party_name':
          type: string
          pattern: '^[ -~]{1,140}$'
          example: John Smith
          description: Initiating Party Name. Must be populated for mandate payments
    GetBatchInformation1:
      type: object
      title: GetBatchInformation1
      description: <p>Payment batch information.</p>
      required:
        - batch_identification
      properties:
        batch_identification:
          type: string
          description: 'Unique identification, as assigned by a sending party, to unambiguously identify the payment information group within the message. When payment is part of a batch, populate with the Batch ID using the following construct: 
            35 characters: 
            It must be unique across the NPP Basic Infrastructure:
              1 - 11 BIC of FI that created the Instruction ID [11]
              12 - 12 Fixed value of B
              13 - 20 YYYYMMDD - Message Creation Date [8]
              21 - 22 Channel/Processing System Identification [2]
              23 - 34 Number [12] which may be initialised at the start of each day
              35 - 35 Retry counter [1], alphanumeric 0 to 9, A to Z. 
              Set at 0 for the first message of a business transaction, increment to the next character on each retry. 
              The values for Channel Identification (XX) are NPP Participant determined and may be used to identify separate channels such as:
                00 - Default value (only one single channel)
                Or for example (multiple channels),
                01 - Internet Banking
                02 - Mobile Banking
                03 - Cash Management
                04 - Treasury
                - 05 - ATM
                - XX - SWIFT PAG
                etc'
          minLength: 1
          maxLength: 35
          example: CUSCAU2SXXXB20251202002121346640010
    IftiInformation2:
      title: IftiInformation2
      type: object
      description: |-
        Encapsulates all international transaction-related details. This block should only be populated when the service code is `sctbxbrdr`, indicating a cross-border payment. It includes attributes required for regulatory compliance, settlement, and reporting.
        
        Example:
        ```json
        {
          "ifti_information": {
            "currency": "AUD",
            "exchange_rate": 55.25,
            "previous_instructing_agent_1": {
              "name": "HSBC London",
              "swift_code": "HBUKGB4BXXX"
            }
          }
        }
        ```
        
        Guidance on `instructed_amount`:
        Mandatory for NPP IFTI payment if present in the source international message.
        In the international request message:
        I. If the inbound settlement amount is non-AUD, it should be populated in this field.  
        II. If the inbound settlement amount is AUD and there is an original instructed amount, the inbound instructed amount should be populated in this field.  
        III. If the inbound settlement amount is AUD but there is no distinct instructed amount, no need to populate this field.
        
        Guidance on `exchange_rate`:
        Mandatory for NPP IFTI payment if present in the source international message.
        In the international request message:
        I. If the inbound settlement amount is in AUD and exchange rate is present, then populate it in this field.  
        II. If the inbound settlement amount is in non-AUD, then populate the exchange rate used for AUD FX conversion in this field.
        
        Guidance on `ultimate_debtor_information` (Offshore debtor's details):
        
        Ultimate Debtor is transformed from the off-shore debtor's information and contains the offshore debtor’s details.
        
        Note:
        i. The BSCT NPP Debtor identifies the NPP participant acting as an intermediary for local clearing and settlement.  
        ii. In absence of a Ultimate Debtor Account component in BSCT `pacs.008`, this information is populated to Ultimate Debtor Private Identification Other –  
        `ifti_information.ultimate_debitor_information.identification_number`
        
        `organisation_identification` guidance:
        Mandatory for NPP IFTI payment if present in the source international message.  
        Mandatory for NPP IFTI payment if Name is not provided.
        
        It indicates identity of any branch or department of the ordering institution which the offshore debtor requested to transmit the instruction; or the identity of the sender's branch or department which transmitted the instruction.
        
        `date_place_of_birth` guidance:
        Mandatory for NPP IFTI payment if present in the source international message.
        
        If the offshore debtor is an individual, this field has the date of birth; country, town, city or locality of birth.
        
        In case date of birth is available but not the country and location, it must be populated in `creditor_agent_instruction.instruction_information`, in the below format:
        ```
        IFTI/Dbtr/Id/PrvtId/DtAndPlcOfBirth/BirthDt//YYYY-MM-DD
        ```
        
        `private_identification` guidance:
        Mandatory for NPP IFTI payment if present in the source international message.
        
        It is a unique identification number given to the offshore debtor by the ordering institution, or the account number of the single account held by the offshore debtor with the ordering institution.
        
        `country_of_residence` guidance:
        Mandatory for NPP IFTI payment if present in the source international message.
        
        It should be populated if the payer is an individual. Country of Residence (where the party physically lives) should be used if different from PostalAddress/Country (country linked to the owner of the account used for contact purposes).
        
        Guidance on `ultimate_creditor_information`:
        Mandatory for NPP IFTI payment if present in the source international message.
        
        Guidance on `initiating_party_information`:
        Mandatory for NPP IFTI payment.
        
        It is the party that initiates the payment. Name, Address and ID are required.
        
        Guidance specific to current (2014 ISO Message version) IPS/IFTI payments triggered on v4 APIs:
        
        Ultimate Debtor name (`ultimate_debtor_information.name`) should contain the offshore debtor's name.
        If the debtor is an organisation with BIC provided instead of name, populate `NOTPROVIDED` in Name.
        
        Ultimate Debtor address (`ultimate_debtor_information.address`) should contain the offshore debtor's address.
        `country_code` and `address_line` are required at a minimum.
        
        The country code is validated against ISO 3166 Alpha-2 codes (e.g. `US` for United States of America, `CA` for Canada).
      required:
        - instruction_identification
        - charge_bearer
        - debtor
        - debtor_account
        - debtor_agent_information
      properties:
        instruction_identification:
          minLength: 1
          maxLength: 35
          type: string
          description: |-
            Instruction identification assigned to the instruction by the sender.
            Mandatory for an NPP IFTI payments.
            Intermediary is optional to either copy Sender’s Reference, or generate its
            own reference.
            Clients who receive proprietary overseas IFTI messages must use their AUSTRAC point-to-point reference field to populate this field.
          example: BANKNTSTXXXN20180501000000000000010
        local_clearing_option:
          maxLength: 35
          type: string
          description: |-
            Specify a local instrument, local clearing option and/or further qualify the service or service 
            level.
        debit_date_time:
          type: string
          description: |
            Date and time at which a payment was debited from overseas FI

            Format ISODateTime, "YYYY-MM-DDThh:mm:ss.sssZ"
          pattern: '^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]{1,3})?(?:Z)$'
          example: '2018-05-11T04:13:41.667Z'
        credit_date_time:
          type: string
          description: |
            Date and time at which a payment has been credited.

            Format: ISODateTime, "YYYY-MM-DDThh:mm:ss.sssZ"
          format: date-time
          example: '2018-05-11T04:13:41.667Z'
        cls_time:
          type: string
          description: |
            Time by which the amount of money must be credited, with confirmation, to the CLS Bank's account at the central bank.
          format: time
          example: '04:13:41.667Z'
        instructed_amount:
          description: This is the amount instructed in the original instruction at the source level. This can be AUD or Non-AUD value.
          allOf:
            - $ref: '#/components/schemas/Amount1'
        exchange_rate:
          maxLength: 11
          pattern: '^(?=.{1,12}$)[0-9]{0,11}(?:\.[0-9]{0,10})?$'
          type: string
          description: |
            Exchange rate used for AUD FX conversion. 
          example: '1.26'
        charge_bearer:
          allOf:
            - $ref: '#/components/schemas/ChargeBearer1'
        charges_information:
          type: array
          minItems: 0
          maxItems: 3
          description: Charges to be paid by the charge bearer(s) related to the payment transaction.
          items:
            $ref: '#/components/schemas/ChargesInformation1'
        payment_purpose_proprietary:
          maxLength: 35
          type: string
          description: |
            Payment proprietary.
            Mandatory for NPP IFTI payment if Present in the source international message
            Any information given in the instruction about the reason for transferring the money must be provided here.
        uetr:
          type: string
          pattern: '[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}'
          example: de2da6c9-18be-48d4-8053-867ed90a316a
          format: uuid
          description: 'Universally unique identifier to provide an end-to-end reference of a payment transaction. UUIDv4Identifier (based on string).identificationScheme: RFC4122; UUIDv4'
        debtor:
          $ref: '#/components/schemas/IftiDebtorInformation1'
        debtor_account:
          $ref: '#/components/schemas/DebtorInformation5'
        debtor_agent_information:
          $ref: '#/components/schemas/DebtorAgentInformation1'
        previous_instructing_agent:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/PreviousInstructingAgent1'
        ultimate_debtor_information:
          $ref: '#/components/schemas/UltimateDebtorInformation1'
        ultimate_creditor_information:
          $ref: '#/components/schemas/UltimateCreditorInformation1'
        creditor_address:
          allOf:
            - $ref: '#/components/schemas/NppAddress1'
            - description: |-
                This represents address of an individual or non-individual customer of a NPP participant. This object could be populated in one of formats below:

                1. Structured address (i.e. Elements: Address Type through Country)  
                2. Unstructured address (i.e. Address Line(s) + optional Country Code)
                3. Unstructured address (i.e. Address Line(s) + optional Country Code) and one or more of the following structured address elements:
                      - Suburb (`<town_name>`)
                      - State (`<ctry_sub_division>` )
                      - Post Code (`<postcode>`)
                      - Country (`<country_code>`)
        initiating_party_information:
          $ref: '#/components/schemas/InitiatingPartyInformation1'
        creditor_agent_instruction:
          type: array
          maxItems: 3
          description: |-
            Further information related to the processing of the payment instruction, provided by the initiating party, and intended for the creditor agent.
          items:
            $ref: '#/components/schemas/CreditorInstructionInformation1'
        next_agent_instruction:
          type: array
          minItems: 1
          maxItems: 3
          description: 'Further information related to the processing of the payment instruction that may need to be acted upon by the next agent.\r\nUsage: The next agent may not be the creditor agent.'
          items:
            type: string
            maxLength: 140
            example: '["Instruction 1", "Instruction 2"]'
        regulatory_reporting:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/RegulatoryReporting1'
        remittance_information_structured:
          type: object
          properties:
            referred_document_information:
              type: array
              maxItems: 3
              items:
                $ref: '#/components/schemas/ReferredDocumentInformation1'
        related_remittance_information:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/RelatedRemittanceInformation2'
        creditor_lei:
          type: string
          pattern: '[A-Z0-9]{18,18}[0-9]{2,2}'
          example: 529900T8BM49AURSDO55
          description: 'Legal entity identifier of the financial institution.\r\nidentificationScheme: Global LEI System; LEIIdentifier'
        debtor_lei:
          type: string
          pattern: '[A-Z0-9]{18,18}[0-9]{2,2}'
          example: 529900T8BM49AURSDO55
          description: 'Legal entity identifier of the financial institution.\r\nidentificationScheme: Global LEI System; LEIIdentifier'
        service_level:
          description: 'Populate the service level values from incoming international message here in Instance#1, 2 and 3. For example SEPA, BKTR, G001 etc.'
          type: array
          minItems: 0
          maxItems: 3
          items:
            $ref: '#/components/schemas/ServiceLevelIFTI'
    RegulatoryReporting1:
      title: RegulatoryReporting1
      type: object
      properties:
        reporting_type:
          $ref: '#/components/schemas/ReportingType1'
        authority_name:
          maxLength: 140
          type: string
        authority_country:
          pattern: '[A-Z]{2,2}'
          type: string
          example: AU
        details:
          type: array
          items:
            $ref: '#/components/schemas/RegulatoryReportingDetails1'
          description: ''
      description: |
        Mandatory for NPP IFTI payment if Present in the source international message
        It is the information needed due to regulatory and statutory requirements
    RegulatoryReportingDetails1:
      title: RegulatoryReportingDetails1
      type: object
      properties:
        type:
          maxLength: 35
          type: string
        date:
          type: string
          format: date-time
        country:
          pattern: '[A-Z]{2,2}'
          type: string
          example: AU
        code:
          maxLength: 10
          type: string
          example: DBTRTP
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount1'
            - description: Transaction Amount
        information:
          type: array
          items:
            maxLength: 35
            type: string
          description: ''
    RelatedRemittanceInformation2:
      title: RelatedRemittanceInformation2
      type: object
      description: Mandatory for NPP IFTI payment if Present in the source international message. Provides information related to the handling of the remittance information by any of the agents in the transaction processing chain.
      properties:
        identification:
          maxLength: 35
          type: string
        location_details:
          type: array
          items:
            $ref: '#/components/schemas/RemittanceLocationDetails2'
    RemittanceLocationDetails2:
      title: RemittanceLocationDetails2
      type: object
      required:
        - method
      properties:
        method:
          allOf:
            - $ref: '#/components/schemas/RemittanceInformationMethod1Code'
            - maxLength: 4
              minLength: 4
        electronic_address:
          maxLength: 2048
          type: string
          example: rem@gmail.com
        postal_address:
          allOf:
            - $ref: '#/components/schemas/NppAddress2'
            - description: |-
                This represents address of an individual or non-individual customer of a NPP participant. This object could be populated in one of formats below:

                1. Structured address (i.e. Elements: Address Type through Country)  
                2. Unstructured address (i.e. Address Line(s) + optional Country Code)
                3. Unstructured address (i.e. Address Line(s) + optional Country Code) and one or more of the following structured address elements:
                      - Suburb (`<town_name>`)
                      - State (`<ctry_sub_division>` )
                      - Post Code (`<postcode>`)
                      - Country (`<country_code>`)
    ChargesInformation1:
      title: ChargesInformation1
      required:
        - amount
        - agent_bic
      type: object
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount1'
            - description: Transaction Amount
        agent_bic:
          pattern: '[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}'
          type: string
          description: "Agent that takes the transaction charges or to which the transaction charges are due."
          example: YOURBIC1234
      description: |
        Provides information on the charges to be paid by the charge bearer(s) related to the payment transaction.
        Multiple occurrences of ChrgsInf is allowed, for each occurrence of ChrgsInf, Amt and Agt BICFI is mandatory.
    CreditorInstructionInformation1:
      type: object
      title: creditorInstructionInformation
      description: |-
        Further information related to the processing of the payment instruction,
        provided by the initiating party, and intended for the creditor agent.
        
        Mapping Guidance for unsupported inbound IFTI elements in NPP message:
        To accommodate the requirement to forward all data as received from an inbound
        IFTI payment within the NPP payment itself, a number of data elements may not
        have a direct mapping home to a specific element in the IPS pacs.008 and as a
        consequence will be captured in the IPS pacs.008
        InstructionForCreditorAgent (IFCA) element.
        
        This typically arises because the NPP IPS element is designated for specific
        domestic payment content or is disabled.
        
        The following generic naming conventions for IFCA content should be observed
        to ensure that the individual data items can be correctly identified by the
        message recipient (applies to those not explicitly mentioned under annotations).
        
        For XML-based IFTI message structures, each occurrence of the IFCA element must
        be populated with a name–value pair as follows:
        
        - Name prefixed with "IFTI/"
        - Name composed of a reduced XML XPath from the source message that is meaningful
          and clearly identifies the data item in question
        - Name terminated with "//"
        - Data value
        
        Examples:
          - IFTI/PrvInstgAgt1/FinInstnId/BICFI//BANKAU12XXX
          - IFTI/InstgAgt/FinInstnId/ABN//" + ABN
      properties:
        code:
          $ref: '#/components/schemas/CreditorAgent1Code'
        instruction_information:
          type: string
          maxLength: 140
          example: OrgnlTxId/CTBAAUSNXXXN20160826021608261424110
          description: |-
            Further information complementing the coded instruction or instruction to the
            creditor's agent that is bilaterally agreed or specific to a user community.
            
            ## Guidance
            
            ### NPP – Payment Return
            
            Specific iteration of InstructionForCreditAgent when payment is returned using
            pacs.008. Code element is not used.
            
            Copy from original IPS pacs.008 TransactionIdentification  
            `<CdtTrfTxInf/PmtId/TxId>`  
            to  
            `<CdtTrfTxInf/InstrForCdtrAgt/InstrInf>`  
            as a new line prefixed with `"OrgnlTxId/"`.
            
            **Example:**  
            `OrgnlTxId/CTBAAUSNXXXN20160826021608261424110`
            
            ### From inbound International pacs.008 (CBPR+)
            
            **CBPR+ XPath:**  
            `/Document/FIToFICstmrCdtTrf/CdtTrfTxInf/InstrForCdtrAgt/InstrInf`
            
            **CBPR+ Name:**  
            InstructionForCreditorAgent InstructionInformation
            
            **CBPR+ Multiplicity:**  
            `0..1`
            
            **CBPR+ Data Type:**  
            `Max140Text`
            
            **Additional Guidance:**  
            For every instance of inbound CBPR+ `InstrForCdtrAgt/InstrInf` that is present,
            copy it directly to a new occurrence in NPP `InstrForCdtrAgt/InstrInf`.
            
            **IFTI Data Requirement:**  
            Could Have
            
            ### From inbound International pacs.008 (CBPR+) – IFTI Transaction Identification
            
            **CBPR+ XPath:**  
            `/Document/FIToFICstmrCdtTrf/CdtTrfTxInf/PmtId/TxId`
            
            **CBPR+ Name:**  
            TransactionIdentification
            
            **CBPR+ Multiplicity:**  
            `0..1`
            
            **CBPR+ Data Type:**  
            `Max35Text`
            
            **Additional Guidance:**  
            To retain and refrain the optional inbound CBPR+ `TxId` from being overwritten by
            the NPP `TxId`, copy it to a new occurrence of `InstrInf` with prefix  
            `"IFTI/TxId//"`.
            
            **IFTI Data Requirement:**  
            Must Provide if Present
            
            ### IFTI General Guidance
            
            This is general guidance for NPP participants on an IFTI payment originating from
            an inbound channel other than CBPR+.
            
            **IPS Guidance:**  
            NPP IFTI Payer Participant guidance for populating the Additional Identifiers of
            the Anchor Bank (ABN, Date of Incorporation, Place of Incorporation).
            
            **Additional Guidance:**  
            Copy the available elements of Additional Identifiers, prefixed with the
            respective code word, to a new occurrence of Instruction for Creditor Agent:  
            `<Document/FIToFICstmrCdtTrf/CdtTrfTxInf/InstrForCdtrAgt/InstrInf>`
            
            - `"IFTI/InstgAgt/FinInstnId/ABN//"` + ABN
            - `"IFTI/InstgAgt/FinInstnId/DCRP//"` + Date of Incorporation
            - `"IFTI/InstgAgt/FinInstnId/PCRP//"` + Place of Incorporation
            
            **IFTI Data Requirement:**  
            Could Have
            
            ### From inbound International pacs.008 (CBPR+) – Instructing Agent
            
            **CBPR+ XPath:**  
            `/Document/FIToFICstmrCdtTrf/CdtTrfTxInf/InstgAgt/FinInstnId`
            
            **CBPR+ Name:**  
            InstructingAgent FinancialInstitutionIdentification
            
            **CBPR+ Multiplicity:**  
            `1..1`
            
            **CBPR+ Data Type:**  
            Component
            
            **Additional Guidance:**  
            If all three instances of Previous Instructing Agents are occupied in CBPR+,
            map the CBPR+ pacs.008 Instructing Agent to NPP IPS pacs.008 IFCA.
            
            For each occurrence of the CBPR+ `InstgAgt` sub-element, create a new occurrence
            of `<InstrForCdtrAgt/InstrInf>` with the following code words:
            
            - `"IFTI/InstgAgt/FinInstnId/BICFI//"` + BICFI
            - `"IFTI/InstgAgt/FinInstnId/ClrSysMmbId/ClrSysId/Cd//"` + Cd
            - `"IFTI/InstgAgt/FinInstnId/ClrSysMmbId/MmbId//"` + MmbId
            - `"IFTI/InstgAgt/FinInstnId/LEI//"` + LEI
            
            **IFTI Data Requirement:**  
            Could Have
            
            ### Return using pacs.008 (CBPR+) – IFTI
            
            The following guidance is for mapping to the original NPP message in an IFTI
            payment return scenario.
            
            **Source Element:**  
            Original IPS pacs.008 Transaction Identification  
            `<CdtTrfTxInf/PmtId/TxId>`
            
            **Additional Guidance:**  
            Mandatory for IFTI payment return using pacs.008.
            
            Copy original IFTI pacs.008 Transaction Identification  
            `<CdtTrfTxInf/PmtId/TxId>`  
            and create a new occurrence of  
            `<CdtTrfTxInf/InstrForCdtrAgt/InstrInf>`  
            prefixed with `"OrgnlTxId/"`.
    PreviousInstructingAgent1:
      title: PreviousInstructingAgent1
      type: object
      properties:
        agent_bic:
          pattern: '[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}'
          type: string
          example: YOURBIC1234
          description: Code allocated to a financial institution by the ISO 9362 Registration Authority as described in ISO 9362 "Banking - Banking telecommunication messages - Business identifier code (BIC)"
        clearing_system_identification:
          maxLength: 35
          type: string
          description: Identification of a member of a clearing system.
        clearing_system_member_identification:
          maxLength: 35
          type: string
          description: Specification of a pre-agreed offering between clearing agents or the channel through which the payment instruction is processed.
      description: |
        At least one of the below fields must be present.
        It is the identification of the agent, who instructs the intermediary bank / the NPP payer participant for NPP clearing, should be captured in IPS(NPP leg) Previous Instructing Agent.
    DateAndPlaceOfBirth1:
      title: DateAndPlaceOfBirth1
      type: object
      description: |-
        This represents mandated Customer Data, which should be populated by NPP Participants for payer initiating the payment or payee initiating a payment return.It is a client obligation and a compliance requirement to ensure the following sanctions information is sent in all payments.
        If the Debtor is an Individual, date_of_birth or place_of_birth or address should be present.
        If the Debtor is a non-Individual, date_of_incorporation or place_of_incorporation or business_abn or address should be present.
      properties:
        birth_date:
          type: string
          description: Date on which a person is born. YYYY-MM-DD (ISODate format).
        place_of_birth:
          maxLength: 35
          type: string
          description: Province where a person was born.
        city_of_birth:
          maxLength: 35
          type: string
          description: City where a person was born.
        country_of_birth:
          pattern: '[A-Z]{2,2}'
          type: string
          description: Country where a person was born.
          example: AU
    GenericIdentification1:
      title: GenericIdentification1
      description: 'If present, either identification_type_proprietary or identification_type_code can be populated.Both the fields can''t be present together.'
      required:
        - identification
      type: object
      properties:
        identification:
          maxLength: 35
          type: string
          description: Identification assigned by an institution.
        identification_type_proprietary:
          maxLength: 35
          type: string
          description: Name of the identification scheme, in a free text form.
        identification_type_code:
          maxLength: 4
          minLength: 1
          type: string
          description: Name of the identification scheme, in a coded form as published in an external list.
          example: BBAN
        identification_issuer:
          maxLength: 35
          type: string
          description: Entity that assigns the identification.
    GenericIdentification2:
      title: GenericIdentification2
      type: object
      description: 'If present, either identification_type_proprietary or identification_type_code can be populated.Both the fields can''t be present together.'
      properties:
        lei:
          type: string
          description: 'Legal entity identifier of the financial institution.\r\nidentificationScheme: Global LEI System; LEIIdentifier'
          pattern: '[A-Z0-9]{18,18}[0-9]{2,2}'
          example: 529900T8BM49AURSDO55
        other:
          type: array
          maxItems: 3
          minItems: 1
          description: Unique identification of an organisation, as assigned by an institution, using an identification scheme.
          items:
            $ref: '#/components/schemas/GenericIdentification1'
    GenericPersonIdentification1:
      title: GenericPersonIdentification1
      type: object
      description: |
        This is transformed from the off-shore debtor's information.
        Must contain if present from the inbound cross-border payment.
        It is a unique identification number given to the offshore debtor by the ordering institution, or the account number of the single account held by the offshore debtor with the ordering institution.
      required:
        - identification
      properties:
        identification:
          maxLength: 35
          type: string
          description: Unique and unambiguous identification of a person.
        identification_type_proprietary:
          maxLength: 35
          type: string
          description: Name of the identification scheme, in a free text form.
        identification_type_code:
          maxLength: 4
          minLength: 1
          type: string
          description: Name of the identification scheme, in a coded form as published in an external list.
          example: ARNU
        identification_issuer:
          maxLength: 35
          type: string
          description: Entity that assigns the identification.
    GenericOrganisationIdentification1:
      title: GenericOrganisationIdentification1
      type: object
      description: | 
        Mandatory for NPP IFTI Payment if Name is not provided.
        This is the identity of any branch or department of the ordering institution which the offshore debtor requested to transmit the instruction; or the identity of the sender’s branch or department which transmitted the instruction
      properties:
        lei:
          type: string
          description: Legal entity identification as an alternate identification for a party.
          pattern: '[A-Z0-9]{18,18}[0-9]{2,2}'
          example: 529900T8BM49AURSDO55
        other:
          type: array
          maxItems: 3
          minItems: 1
          description: Unique identification of an organisation, as assigned by an institution, using an identification scheme.
          items:
            $ref: '#/components/schemas/GenericIdentification1'
    ReferredDocumentInformation1:
      title: ReferredDocumentInformation1
      type: object
      properties:
        code:
          $ref: '#/components/schemas/StructuredReferredDocumentInformation1Code'
        proprietary:
          maxLength: 35
          type: string
          example: Prtry
        issuer:
          maxLength: 35
          type: string
          example: '123654'
        number:
          maxLength: 35
          type: string
          example: '343456'
        related_date:
          type: string
          format: date
          example: '2023-08-30'
    AccountAliasType1Code:
      title: AccountAliasType1Code
      enum:
        - TELI
        - EMAL
        - AUBN
        - ORGN
      type: string
      description: |-
        PayID Type. Only used when payment is addressed to a PayID. Valid Values: 
        - 'TELI' (Telephone number)
        - 'EMAL' (Email address)
        - 'AUBN' (Australian Business Number)
        - 'ORGN' (Organisation Name)
    AccountIdentificationType1Code:
      title: AccountIdentificationType1Code
      enum:
        - BBAN
        - AIIN
      type: string
      description: Debtor/Creditor's account's scheme
    AccountIdentificationTypeIFTICode:
      title: AccountIdentificationTypeIFTICode
      enum:
        - BBAN
        - AIIN
        - CUID
        - UPIC
      type: string
      description: Debtor/Creditor's account's scheme
    AddressType1:
      title: AddressType1
      enum:
        - ADDR
        - BIZZ
        - DLVY
        - HOME
        - MLTO
        - PBOX
      type: string
      description: |-
        Address Type

        ADDR - Postal Address is the complete postal address
        BIZZ - Business Address is the business address
        DLVY - Delivery To Address is the address to which delivery is to take place
        HOME  - Residential Address is the home address
        MLTO - Mail To Address is the address to which mail is sent
        PBOX - POBox Address is a postal office (PO) box
    ChargeBearer1:
      title: ChargeBearer1
      enum:
        - CRED
        - DEBT
        - SHAR
        - SLEV
      type: string
      description: |
        Specifies which party/parties will bear the charges of processing payment transaction. Valid values - 'CRED'(Borne by Creditor), 'DEBT'(Borne by Debitor), 'SHAR' (Shared), 'SLEV' (Charges are to be applied following the rules agreed in the service level and/or scheme)
    CreditorAgent1Code:
      title: CreditorAgent1Code
      type: string
      description: |-
        Specifies further instructions concerning the processing of a payment instruction, as provided to the creditor agent.
    
        ### Instruction Codes
    
        The following codes indicate how the payment should be handled by the creditor agent:
    
        - `CHQB` — (Ultimate) creditor must be paid by cheque.
        - `HOLD` — Amount of money must be held for the (ultimate) creditor, who will call. Payment is released upon identification.
        - `PHOB` — Please advise or contact the (ultimate) creditor or claimant by phone.
        - `TELB` — Please advise or contact the (ultimate) creditor or claimant by the most efficient means of telecommunication.
    
        Enum:
        [ CHQB, HOLD, PHOB, TELB ]
      enum:
        - CHQB
        - HOLD
        - PHOB
        - TELB
    StructuredReferredDocumentInformation1Code:
      title: StructuredReferredDocumentInformation1Code
      enum:
        - MSIN
        - CNFA
        - DNFA
        - CINV
        - CREN
        - DEBN
        - HIRI
        - SBIN
        - CMCN
        - SOAC
        - DISP
        - BOLD
        - VCHR
        - AROI
        - TSUT
        - PUOR
      type: string
    InstructionPriority1:
      title: InstructionPriority1
      enum:
        - NORM
        - UNAT
      type: string
      description: 'Priority of the payment, Attended or Unattended'
    RemittanceInformationMethod1Code:
      title: RemittanceInformationMethod1Code
      enum:
        - FAXI
        - EDIC
        - URID
        - EMAL
        - POST
        - SMSM
      type: string
    ReportingType1:
      title: ReportingType1
      enum:
        - CRED
        - DEBT
        - BOTH
      type: string
    ServiceLevelIFTI:
      type: string
      minLength: 1
      maxLength: 35
      example: SEPA
    ServiceLevel1:
      title: ServiceLevel1
      enum:
        - sct
        - x2p1
        - catsct
      type: string
      description: Payment method indicating the NPP service under which Cuscal must process this Payment. The applicable NPP service is derived from the Account or Alias Resolution services provided by Cuscal.
    SettlementMethodIdentification1:
      title: SettlementMethodIdentification1
      enum:
        - OFFU
        - CCOM
        - ONUS
      type: string
      description: |-
        Cuscal settlement method. Valid values:
        - OFFU    (Off Us)
        - CCOM  (Cuscal Community)
        - ONUS   (On Us)

        It will be present when a Payment response is received from BI.
    TransactionType1:
      title: TransactionType1
      enum:
        - MAP
        - RAP
        - MAPR
        - RAPR
      type: string
      description: Type of the payment(MAP/RAP/MAPR/RAPR)
      example: MAP
    MandatePaymentStatusResponse1:
      type: object
      required:
        - transaction_status
      properties:
        transaction_status:
          $ref: '#/components/schemas/PaymentTransactionStatus1Code'
        transaction_status_reason_code:
          type: string
          description: Specifies a character string with a maximum length of 4 characters.
          minLength: 1
          maxLength: 4
          example: TM01
      title: MandatePaymentStatusResponse1
      description: |
        Response to a mandate payment status request.
         
        **Property descriptions**: 
         - **transaction_status** - Transaction Status.
        - **transaction_status_reason_code** - Status Reason Information Reason Code. Reject reason code, defining the reason for the transaction status.
    PaymentTransactionStatus1Code:
      type: string
      enum:
        - RECV
        - UNDV
        - SENT
        - SAFD
        - ACCP
        - ACSP
        - ACSC
        - RJCT
      description: '<p>Transaction status Specifies the status of an individual payment instruction. One of the following codes will be present:</p> <table></tr><tr><tr><td>Code</td><td>Definition</td></tr><tr><td>RECV</td><td>Received</td></tr><tr><td>UNDV</td><td>Undelivered</td></tr><tr><td>SENT</td><td>Sent</td></tr><tr><td>SAFD</td><td>Store & Forward</td></tr><tr><td>ACCP</td><td>Accepted for clearance by Receiver</td></tr><tr><td>ACSP</td><td>Settlement aborted by NPP BI</td></tr><tr><td>ACSC</td><td>Accepted & Settled</td></tr><tr><td>RJCT</td><td>Rejected</td></tr></table>'
      example: RJCT
    MandatePaymentInitiationRequest1:
      type: object
      description: |-
        <p>Mandate payment initiation request  </p><p>Property descriptions:</p><ul><li><b>payment_information</b> - Payment Information. Payment initiation request information.</li><li><b>creditor_information</b> - Creditor Information. Provides information on the payment initiation transaction. This object must be present when creditor details are not present on the mandate. This object must be absent when the creditor details are present on the mandate.</li><li><b>batch_information</b> - Batch Information to enable the various Batch Booking and Transaction Grouping identifier elements to
        facilitate the grouping of transactions for further processing. These identifiers are proposed to support Participants in their end to-
        end solutions by enabling the ability to group payments and report transactions individually or consolidated.</li></ul>
      required:
        - payment_information
      properties:
        payment_information:
          $ref: '#/components/schemas/MandatePaymentInitiationInformation1'
        creditor_information:
          $ref: '#/components/schemas/MandatePaymentCreditorPartyInformation1'
        batch_information:
          $ref: '#/components/schemas/MandatePaymentBatchInformation1'
    MandatePaymentInitiationInformation1:
      type: object
      title: MandatePaymentInitiationInformation1
      description: '<p>Mandate payment initiation information</p><p><b>Property descriptions: </b></p><ul><li><b>instruction_identification</b> - Unique identification as assigned by an instructing party to unambiguously identify the payment instruction.</li><li><b>instruction_priority</b> - Indicator of the urgency or order of importance that the instructing party would like the instructed party to apply to the processing of the instruction.</li><li><b>instructed_amount</b> - Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.</li><li><b>charge_bearer</b> - Specifies which party/parties will bear the charges associated with the processing of the payment transaction.</li><li><b>end_to_end_identification</b> - Unique identification assigned by the initiating party to unambiguously identify the transaction. This identification is passed on, unchanged, throughout the entire end-to-end chain. This must be mapped from mandate debtor_information.party_reference when present. If not in mandate and not provided by end user as well for this initiation request, it must be sent as ''NOTPROVIDED''.</li><li><b>remittance_information_unstructured</b> - Unique reference, as assigned by the creditor, to unambiguously refer to the payment transaction..</li><li><b>unique_superannuation_code</b> - Name of the Identification scheme, in a free text form. For category_purpose_code = PENS, comments relating to USI - code indicating the identifier to whom the superannuation fund will be provided in this field.</li><li><b>unique_superannuation_identification</b> - Identification assigned by an institution. For category_purpose_code = PENS, comments relating to USI - the USI number for the superannuation fund will be provided in this field.</li><li><b>last_payment</b> - Set to true to indicate this is the last payment initiation request associated to the mandate. Once the payment for this instruction is settled, Cuscal will cancel the mandate.</li></ul><ul><p>The following rules apply to this structure:</p> <ul><li><strong>CATSCTUniqueSuperannuationRule:</strong>Both unique_superannuation_code and unique_superannuation_identification must be present or both fields must be absent.</li><li><strong>CATSCTUltimateCreditorPartyNameRule:</strong> When unique_superannuation_code and unique_superannuation_identification fields are present, and creditor_information object is present then creditor_information.ultimate_party_name must be present.</li></ul></ul>'
      required:
        - instruction_identification
        - instruction_priority
        - instructed_amount
        - end_to_end_identification
        - mandate_identification
      properties:
        instruction_identification:
          type: string
          description: |-
            A unique Payment Instruction Identifier generated by the initiator. The payment identifier must follow the following fixed character pattern NPP guidelines:

             1 to 11 : Initiator BIC11 

             12 : fixed value 'I' 

             13 to 20 : YYYYMMDD 

             21 to 22 : fixed value '00' 

             23 to 34 : sequence number starting from 000000000001 

             35 : retry counter, always set to 0 unless it's a retry, retries start at 1.
          minLength: 1
          maxLength: 35
          example: BANKNTSTXXXI20180501000000000000010
        instruction_priority:
          $ref: '#/components/schemas/Priority2Code'
        instructed_amount:
          type: string
          maxLength: 34
          pattern: '^(?=.{1,19}$)[0-9]{0,18}(?:\.[0-9]{0,2})?$'
          example: '100.00'
        charge_bearer:
          $ref: '#/components/schemas/ChargeBearerType1Code'
        end_to_end_identification:
          type: string
          minLength: 1
          maxLength: 35
          example: ABC/4562/2020-09-30
          description: Specifies a character string with a maximum length of 35 characters.
        remittance_information_unstructured:
          minLength: 1
          maxLength: 280
          type: string
          description: 'Specifies a character string with a maximum length of 280 characters. '
          example: ABC/P45620/2020-09-30
        unique_superannuation_code:
          type: string
          description: Specifies a character string with a maximum length of 35 ASCII printable characters. Must provide the value as USI for the unique_superannuation_code.
          pattern: '^[ -~]{1,35}$'
          example: USI
        unique_superannuation_identification:
          type: string
          description: Specifies a character string with a maximum length of 35 ASCII printable characters. 
          pattern: '^[ -~]{1,35}$'
          example: '60905115063003, STA0100AU'
        last_payment:
          type: boolean
          default: false
        merchant_identification:
          type: string
          pattern: '^[ -~]{1,35}$'
          description: Unique ID of the merchant.
          example: '41824753556'
        mandate_identification:
          type: string
          pattern: ^[a-f0-9]{12}1[a-f0-9]{3}[89ab][a-f0-9]{15}$
          description: |-
            ID of mandate. 
            Universally Unique IDentifier (UUID) version 1, as described in IETC RFC 4122 "Universally Unique IDentifier (UUID) URN Namespace" without the 4 hyphen separators. For example: '00000000000010008000000000000000' instead of '00000000-0000-1000-8000-000000000000' (without quotes)
          example: 747db4e0774b11eba907b95df9422fde
        payroll_payment_date:
          type: string
          example: '2024-12-14'
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
          description: 'When Category Purpose Code is ''PENS'' and where the payment is for a super contribution or refund payment, populate with the payroll payment date. ''YYYY-MM-DD'' as local date.'
    Priority2Code:
      type: string
      description: <p>Specifies the priority level of an event. </p> <table></tr><tr><tr><td>Code</td><td>Name</td><td>Definition</td></tr><tr><td>UNAT </td><td>Unattended</td><td>    Priority level is unattended. </td></tr><tr><td>NORM</td><td>Normal</td><td>Priority level is normal. </td></table>
      enum:
        - UNAT
        - NORM
    MandatePaymentCreditorPartyInformation1:
      type: object
      title: MandatePaymentCreditorPartyInformation1
      description: |-
        <p>Mandate payment creditor party information.</p><p><b>Property descriptions:</b></p><ul><li><b>party_name</b> - Creditor Name. Name by which creditor party is known and which is usually used to identify that party. This field must be and only present when creditor details are not present on the mandate.</li><li><b>ultimate_party_name</b> - Name by which the ultimate party is known and which is usually used to identify that party.</li><li><b>account_identification_type_code</b> - Creditor Account Identification Other Scheme Name Code. Creditor account identification type, in a coded form:  

           - BBAN - Basic Bank Account Number  
           - ALIA - Alias Identification 

         This field must be and only present when creditor details are not present on the mandate.</li><li><b>account_identification</b> - Creditor Account Identification Other Identification. Unambiguous identification of the account of the creditor to which a credit entry will be posted as a result of the payment transaction. This field must be and only present when creditor details are not present on the mandate.</li><li><b>account_alias_type_code</b> - Creditor Account Proxy Type Proprietary. Creditor Alias Type, in a coded form as published in an external list. For example:  
           - TELE - Telephone Number 
           - EMAL - Email Address 

         This field must be and only present when creditor details are not present on the mandate.</li><li><b>account_alias_identification</b> - Creditor Account Proxy Identification. Identification used to indicate the Creditor account identification under another specified name. This field must be and only present when creditor details are not present on the mandate. </li><li><b>party_reference</b> - Remittance Information Structured Creditor. Unique reference, as assigned by the creditor, to unambiguously refer to the payment transaction.<br></li></ul><ul><p>The following rules apply to this structure:</p> <ul><li><strong>AccountIdentificationRule1:</strong> If account_identification_type_code is not equal to value 'ALIA' then account_identification must be present, and account_alias_type_code and account_alias_identification must be absent.</li><li><strong>AccountIdentificationRule2:</strong> If account_identification_type_code is equal to value 'ALIA' then account_alias_type_code and account_alias_identification must be present, and account_identification must be absent.</li><li><strong>AccountIdentificationRule3:</strong> When account_identification_type_code is 'BBAN', the account_identification field should contain BSB in the first 6 positions followed by the account number.</li></ul></ul>
      required:
        - party_name
        - ultimate_party_name
        - account_identification_type_code
      properties:
        party_name:
          pattern: '^[ -~]{1,140}$'
          type: string
          description: Specifies a character string with a maximum length of 140 ASCII printable characters.
          example: DEF Electronics
        ultimate_party_name:
          pattern: '^[ -~]{1,140}$'
          type: string
          description: Specifies a character string with a maximum length of 140 ASCII printable characters.
          example: JOE BLOGGS
        account_identification_type_code:
          $ref: '#/components/schemas/MandateAccountIdentificationType1Code'
        account_identification:
          pattern: '^[ -~]{1,34}$'
          type: string
          description: Specifies a character string with a maximum length of 34 ASCII printable characters.
          example: '061245125574999'
        account_alias_type_code:
          $ref: '#/components/schemas/MandateAccountAliasType1Code'
        account_alias_identification:
          type: string
          description: 'Specifies a character string with a maximum length of 2048 characters. '
          minLength: 1
          maxLength: 2048
          example: mrsmith@hotmailtest.com
        party_reference:
          pattern: '^[ -~]{1,35}$'
          type: string
          description: Specifies a character string with a maximum length of 35 ASCII printable characters.
          example: my creditor reference
        merchant_category_code:
          type: string
          minLength: 4
          maxLength: 4
          example: '4900'
          description: 'Unique identification of an organisation, as assigned by an institution, using an identification scheme. If the mandate created by the Initiating Party has creditor_information.party_type = "ORGN"` and mandate_purpose_code is one of ["OTHR", "PERS", "UTIL", "GAMP", "RETL"], the Merchant Category Code (MCC) MUST be provided by the Initiating Party. For all other mandate_purpose_code values, the Initiating Party MAY provide the MCC.'
        ultimate_party_merchant_category_code:
          type: string
          minLength: 4
          maxLength: 4
          example: '4900'
          description: 'Unique identification of an organisation, as assigned by an institution, using an identification scheme. If the mandate created by the Initiating Party has creditor_information.party_type = "ORGN"` and mandate_purpose_code is one of ["OTHR", "PERS", "UTIL", "GAMP", "RETL"], the Merchant Category Code (MCC) SHOULD be provided by the Initiating Party. For all other mandate_purpose_code values, the Initiating Party MAY provide the MCC.'
    MandatePaymentInformation1:
      type: object
      title: MandatePaymentInformation1
      description: '<p>Set of characteristics detailing mandate payment information.</p>    <p><strong>Property descriptions:</p></strong>  <ul> <li><strong>payment_frequency</strong> - Regularity with which instructions are to be created and processed.<br>NPPA CX guideline:<br>  Describes the frequency within which payments MAY be initiated against this payment arrangement.<ul> <li>Short view: MUST</li><li> Detailed view: MUST</li></ul> Refer to cx_payment_frequency_label for label and cx_payment_frequency_display for display value</li>   <li><strong>payment_execute_not_before_time</strong> - Indicates that each execution of the mandate payment should not occur before a given time of that execution day.<br> NPPA CX guideline: <br>  Provides ability to specify that a payment does not get initiated before a given time of the defined execution date. SHOULD be displayed under Frequency  <ul> <li>Short view: MAY </li> <li>Detailed view: MUST </li></ul> Refer to cx_payment_execute_not_before_time_label for label  </li>  <li><strong>count_per_period</strong> - Qualifies the frequency in terms of the number of instructions to be created and processed during the specified period.<br>NPPA CX guideline:  <br><ul><li> Short view: MUST </li> <li>Detailed view: MUST </li></ul> Refer to cx_payment_frequency_label for label and cx_payment_frequency_display for display value SHOULD be combined with frequency </li>  <li><strong>point_in_time</strong> - Qualifies the frequency in terms of an exact point in time or moment within the specified period.<br>NPPA CX guideline:  <br><ul><li> Short view: MUST </li> <li>Detailed view: MUST </li></ul> Refer to cx_payment_frequency_label for label and cx_payment_frequency_display for display value  <br> SHOULD be combined with frequency </li>  <li><strong>payment_amount_type</strong> - Identifies the mandate payment arrangement.<br>NPPA CX guideline:  <br><ul><li> Short view: MAY </li> <li>Detailed view: SHOULD </li></ul>Refer to cx_payment_amount_type_label for label and cx_payment_amount_type_display for display value.</li>  <li><strong>first_payment_amount</strong> - Amount different from the payment amount, as it includes the costs associated with the first debited amount. <br>NPPA CX guideline:  <br><ul><li> Short view: SHOULD </li> <li>Detailed view: MUST </li></ul>Refer to cx_first_payment_amount_label for label<li><strong>last_payment_amount</strong> - Last payment amount different  to the payment amount.<br>NPPA CX guideline:  <br><ul><li> Short view: SHOULD </li> <li>Detailed view: MUST </li></ul>Refer to cx_last_payment_amount_label for label.<br> The last payment amount MAY be specified for instances where the final payment amount of an arrangement varies from the regular amount. </li>  <li><strong>amount</strong> - Fixed amount to be debited from the debtor''s account.<br>NPPA CX guideline:  <br><ul><li> Short view: MUST </li> <li>Detailed view: MUST </li></ul> Refer to cx_amount_label for label and cx_amount_display for display value </li>  <li><strong>maximum_amount</strong> - Maximum amount that may be paid from the debtors account, per instruction.<br>NPPA CX guideline:  <br><ul><li> Short view: MUST </li> <li>Detailed view: MUST </li></ul> Refer to cx_amount_label for label and cx_amount_display for display value </li>  <li><strong>first_payment_date</strong> - Date of the first payment predefined in mandate.<br>NPPA CX guideline:  </br><ul><li> Short view: SHOULD </li> <li>Detailed view: MUST </li></ul></li>  <li><strong>last_payment_date</strong> - Date of the last payment predefined in mandate.<br>NPPA CX guideline:  </br><ul><li> Short view: SHOULD </li> <li>Detailed view: MUST </li></ul></li></ul><p>    The following rules apply to this structure:</p> <p> PaymentAmountTypeRule: If `payment_amount_type` code is equal to value ''FIXE'' then `amount` must be present.</p>'
      properties:
        payment_frequency:
          allOf:
            - $ref: '#/components/schemas/MandatePaymentInformationFrequencyCode'
            - description: <table><tr><th>Code</th><th>Name</th><th>Description</th></tr><tr><td>ADHO</td><td>Adhoc</td><td>Event takes place on request or as necessary.</td></tr><tr><td>DAIL</td><td>Daily</td><td>Event takes place every day.</td></tr><tr><td>FRTN</td><td>Fortnightly</td><td>Event takes place every two weeks.</td></tr><tr><td>INDA</td><td>IntraDay</td><td>Event takes place several times a day.</td></tr><tr><td>MIAN</td><td>SemiAnnual</td><td>Event takes place every six months or two times a year.</td></tr><tr><td>MNTH</td><td>Monthly</td><td>Event takes place every month or once a month.</td></tr><tr><td>QURT</td><td>Quarterly</td><td>Event takes place every three months or four times a year.</td></tr><tr><td>WEEK</td><td>Weekly</td><td>Event takes place once a week.</td></tr><tr><td>YEAR</td><td>Annual</td><td>Event takes place every year or once a year.</td></tr></table>
        payment_execute_not_before_time:
          type: string
          description: an ISOTime whereby all timezoned time values are UTC.
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]{1,3})?(?:Z)|(-)$'
          example: '23:22:52Z'
        count_per_period:
          type: string
          pattern: '^(?=.{1,19}$)[0-9]{0,19}(?:\.[0-9]{0,18})?$'
          example: '1'
        point_in_time:
          type: string
          description: Specifies a numeric string with an exact length of 2 digits.
          pattern: '^[0-9]{2}$'
          example: '09'
        payment_amount_type:
          allOf:
            - $ref: '#/components/schemas/MandatePaymentTypeCode'
            - description: |-
                Identifies the mandate payment arrangement.
                <table><tr><th>Code</th><th>Name</th><th>Description</th></tr><tr><td>BALN</td><td>Balloon</td><td>Payment amount is fixed with large final payment amount.</td></tr><tr><td>FIXE</td><td>Fixed</td><td>Payment amount is fixed.</td></tr><tr><td>USGB</td><td>UsageBased</td><td>Payment amount is based on usage.</td></tr><tr><td>VARI</td><td>Variable</td><td>Payment amount is variable.</td></tr></table>
        first_payment_amount:
          allOf:
            - $ref: '#/components/schemas/ActiveCurrencyAndAmount'
            - description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
        last_payment_amount:
          allOf:
            - $ref: '#/components/schemas/ActiveCurrencyAndAmount'
            - description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
        amount:
          allOf:
            - $ref: '#/components/schemas/ActiveCurrencyAndAmount'
            - description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
        maximum_amount:
          allOf:
            - $ref: '#/components/schemas/ActiveCurrencyAndAmount'
            - description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
        first_payment_date:
          type: string
          description: 'A particular point in the progression of time in a calendar year expressed in the YYYY-MM-DD format. This representation is defined in "XML Schema Part 2: Datatypes Second Edition - W3C Recommendation 28 October 2004" which is aligned with ISO 8601.'
          pattern: '^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)$'
          example: '2023-09-20'
        last_payment_date:
          type: string
          description: 'A particular point in the progression of time in a calendar year expressed in the YYYY-MM-DD format. This representation is defined in "XML Schema Part 2: Datatypes Second Edition - W3C Recommendation 28 October 2004" which is aligned with ISO 8601.'
          pattern: '^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)$'
          example: '2028-09-20'
      required:
        - payment_frequency
    MandatePaymentInformationFrequencyCode:
      type: string
      enum:
        - ADHO
        - DAIL
        - FRTN
        - INDA
        - MIAN
        - MNTH
        - QURT
        - WEEK
        - YEAR
      title: MandatePaymentInformationFrequencyCode
      description: <table><tr><th>Code</th><th>Name</th><th>Description</th></tr><tr><td>ADHO</td><td>Adhoc</td><td>Event takes place on request or as necessary.</td></tr><tr><td>DAIL</td><td>Daily</td><td>Event takes place every day.</td></tr><tr><td>FRTN</td><td>Fortnightly</td><td>Event takes place every two weeks.</td></tr><tr><td>INDA</td><td>IntraDay</td><td>Event takes place several times a day.</td></tr><tr><td>MIAN</td><td>SemiAnnual</td><td>Event takes place every six months or two times a year.</td></tr><tr><td>MNTH</td><td>Monthly</td><td>Event takes place every month or once a month.</td></tr><tr><td>QURT</td><td>Quarterly</td><td>Event takes place every three months or four times a year.</td></tr><tr><td>WEEK</td><td>Weekly</td><td>Event takes place once a week.</td></tr><tr><td>YEAR</td><td>Annual</td><td>Event takes place every year or once a year.</td></tr></table>
      example: MNTH
    MandatePaymentTypeCode:
      type: string
      enum:
        - BALN
        - FIXE
        - USGB
        - VARI
      title: MandatePaymentTypeCode
      description: |-
        Identifies the mandate payment arrangement.
        <table><tr><th>Code</th><th>Name</th><th>Description</th></tr><tr><td>BALN</td><td>Balloon</td><td>Payment amount is fixed with large final payment amount.</td></tr><tr><td>FIXE</td><td>Fixed</td><td>Payment amount is fixed.</td></tr><tr><td>USGB</td><td>UsageBased</td><td>Payment amount is based on usage.</td></tr><tr><td>VARI</td><td>Variable</td><td>Payment amount is variable.</td></tr></table>
      example: FIXE
    ActiveCurrencyAndAmount:
      type: object
      title: ActiveCurrencyAndAmount
      description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
      properties:
        amount:
          type: string
          pattern: '^(?=.{1,19}$)[0-9]{0,18}(?:\.[0-9]{0,2})?$'
          maxLength: 19
          example: '30'
        currency:
          type: string
          description: A code allocated to a currency by a Maintenance Agency under an international identification scheme as described in the latest edition of the international standard ISO 4217 "Codes for the representation of currencies and funds".
          pattern: '^[A-Z]{3,3}$'
          example: AUD
    MandatePaymentBatchInformation1:
      type: object
      title: MandatePaymentBatchInformation1
      description: <p>Mandate payment batch information.</p>
      required:
        - batch_identification
      properties:
        batch_identification:
          type: string
          description: 'Unique identification, as assigned by a sending party, to unambiguously identify the payment information group within the message. When payment is part of a batch, populate with the Batch ID using the following construct: 
            35 characters: 
            It must be unique across the NPP Basic Infrastructure:
              1 - 11 BIC of FI that created the Instruction ID [11]
              12 - 12 Fixed value of B
              13 - 20 YYYYMMDD - Message Creation Date [8]
              21 - 22 Channel/Processing System Identification [2]
              23 - 34 Number [12] which may be initialised at the start of each day
              35 - 35 Retry counter [1], alphanumeric 0 to 9, A to Z. 
              Set at 0 for the first message of a business transaction, increment to the next character on each retry. 
              The values for Channel Identification (XX) are NPP Participant determined and may be used to identify separate channels such as:
                00 - Default value (only one single channel)
                Or for example (multiple channels),
                01 - Internet Banking
                02 - Mobile Banking
                03 - Cash Management
                04 - Treasury
                - 05 - ATM
                - XX - SWIFT PAG
                etc'
          minLength: 1
          maxLength: 35
          example: CUSCAU2SXXXB20251202002121346640010
        batch_booking_indicator:
          type: boolean
          description: 'Indicator to determine whether a batch or individual booking is to be made on the debit side, true – Report as a single consolidate debit amount, false – Report as individual debit transactions.'
          example: false
        number_of_transactions:
          type: string
          maxLength: 15
          pattern: '[0-9]{1,15}'
          example: '20'
          description: 'Number of individual transactions contained in the payment information group. Mandatory where batch_booking_indicator is set to true.'
        batch_amount:
          type: string
          maxLength: 34
          pattern: '^(?=.{1,19}$)[0-9]{0,18}(?:\.[0-9]{0,2})?$'
          example: '100.00'
          description: 'Total of all individual amounts included in the group, irrespective of currencies. Mandatory where batch_booking_indicator is set to true.'
        batch_id_expiry:
          type: string
          description: 'Further information related to the processing of the payment instruction, that may need to be acted upon by the debtor agent, depending on agreement between debtor and the debtor agent. Mandatory where batch_booking_indicator is set to true.'
          format: date-time
          example: '2025-10-20T10:10:10.000Z'
    ChargeBearerType1Code:
      type: string
      description: |-
        <p>Specifies which party(ies) will pay charges due for processing of the instruction.</p><table><tr><td>Code</td><td>Description</td></tr><tr><td>CRED</td><td>All transaction charges are to be borne by the creditor.<tr><td>DEBT</td><td>All transaction charges are to be borne by the debtor.<tr><td>SHAR </td><td>Shared In a credit transfer context, 
         means that transaction charges on the sender side are to be borne by the debtor,
         transaction charges on the receiver side are to be borne by the creditor. 
         In a direct debit context, means that transaction charges on the sender side are to be borne by the creditor,
         transaction charges on the receiver side are to be borne by the debtor.<tr><td>SLEV </td><td>Service Level Charges are to be applied following the 
         rules agreed in the service level and/or scheme.</tr></table>
      enum:
        - CRED
        - DEBT
        - SHAR
        - SLEV
      default: SLEV
    MandateAccountAliasType1Code:
      title: MandateAccountAliasType1Code
      type: string
      enum:
        - TELI
        - EMAL
        - AUBN
        - ORGN
      description: ' <p>Specifies the name of Alias Type.</p><table><tr><th>Code</th><th>Description</th></tr><tr><td>TELI</td><td>Telephone Number (Note that the ISO Code is TELE, but in AU-NPP context, TELI is used)</td></tr><tr><td>EMAL</td><td>Email Address</td></tr><tr><td>AUBN</td><td>Australian Business Number</td></tr><tr><td>ORGN</td><td>Organisation Identifier</td></tr></table>'
    MandateAccountIdentificationType1Code:
      title: MandateAccountIdentificationType1Code
      type: string
      enum:
        - BBAN
        - ALIA
      description: <p>Specifies the type of account identification.</p><table><tr><td>Code</td><td>Description</td></tr><tr><td>BBAN</td><td>Basic Bank Account Number</td></tr><tr><td>ALIA</td><td>Alias Identification</td></tr></table>
    MandatePurpose1Code:
      title: MandatePurpose1Code
      type: string
      enum:
        - MORT
        - UTIL
        - LOAN
        - DEPD
        - GAMP
        - RETL
        - SALA
        - PERS
        - GOVT
        - PENS
        - TAXS
        - HLRP 
        - UBIL 
        - GAMB
        - REFU
        - OTHR
      description: <p>Specifies the high-level purpose of the mandate based on a set of pre-defined categories.</p> <table> <tr><td>Code</td><td>Description</td></tr> <tr><td>MORT</td><td>Mortgage Payments</td></tr> <tr><td>UTIL</td><td>Utility Payments</td></tr> <tr><td>LOAN</td><td>Loan Payments</td></tr> <tr><td>DEPD</td><td>Dependant Support Payments</td></tr> <tr><td>GAMP</td><td>Gambling Payments</td></tr> <tr><td>RETL</td><td>Retail Payments</td></tr> <tr><td>SALA</td><td>Salary Payments</td></tr> <tr><td>PERS</td><td>Personal Payment</td></tr> <tr><td>GOVT</td><td>Government Payments</td></tr> <tr><td>PENS</td><td>Pension Payments</td></tr> <tr><td>TAXS</td><td>Tax Payments</td></tr> <tr><td>HLRP</td><td>Property Loan Repayment</td></tr> <tr><td>UBIL</td><td>Utility Payments </td></tr> <tr><td>GAMB</td><td>Gambling Payments</td></tr> <tr><td>REFU</td><td>Refund Payments</td></tr> <tr><td>OTHR</td><td>Other Service Payments</td></tr> </table>
      example: SALA
    MandatePaymentInstructionResponse1:
      type: object
      required:
        - payment_instruction_details
      properties:
        payment_instruction_details:
          $ref: '#/components/schemas/MandatePaymentInstructionDetail1'
      title: MandatePaymentInstructionResponse1
      description: |-
        Response to a successful mandate payment instruction retrieval request. 
         
        **Property descriptions**: 
         - **payment_instruction_details** - Payment instruction details.
    MandatePaymentInstructionDetail1:
      title: MandatePaymentInstructionDetail1
      description: |-
        Details of the payment instruction.
          
        **Property descriptions**:
         - **payment_information** - Payment Information. Payment initiation request information.
         - **debtor_information** - Debtor Information. Information concerning debtor/payer party of the mandate payment.
         - **creditor_information** - Creditor Information. Information concerning creditor/payee party of the mandate payment. 
         - **mandate_information** - Mandate Related Information 
         - **transaction_status_information** - Transaction Information and Status. Status of the payment initiation request.
      type: object
      properties:
        payment_information:
          $ref: '#/components/schemas/MandatePaymentInstructionInitiationInformation1'
        debtor_information:
          $ref: '#/components/schemas/MandatePaymentInstructionDebtorInformation1'
        creditor_information:
          $ref: '#/components/schemas/MandatePaymentInstructionCreditorInformation1'
        mandate_information:
          $ref: '#/components/schemas/MandatePaymentInstructionMandateInformation1'
        transaction_status_information:
          $ref: '#/components/schemas/MandatePaymentInstructionReponseInformation1'
        batch_information:
          $ref: '#/components/schemas/MandatePaymentBatchInformation1'
      required:
        - payment_information
        - transaction_status_information
    MandatePaymentInstructionInitiationInformation1:
      type: object
      required:
        - transaction_type
        - creation_date_time
        - instruction_identification
        - instructed_amount
      properties:
        transaction_type:
          $ref: '#/components/schemas/PaymentInstructionSource1Code'
        creation_date_time:
          type: string
          description: An ISODateTime whereby all timezoned dateTime values are UTC.
          pattern: '^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]{1,3})?(?:Z)$'
          example: '2023-02-02T18:22:44.667Z'
        instruction_identification:
          type: string
          description: |-
            A unique Payment Instruction Identifier generated by the initiator. The payment identifier must follow the following fixed character pattern NPP guidelines: 

             1 to 11 : initiator BIC11 

             12 : fixed value 'I' 

             13 to 20 : YYYYMMDD 

             21 to 22 : fixed value '00' 

             23 to 34 : sequence number starting from 000000000001 

             35 : retry counter, always set to 0 unless it's a retry, retries start at 1.
          minLength: 1
          maxLength: 35
          example: CUSCAU2SXXXI20180501000000000000010
        instruction_priority:
          $ref: '#/components/schemas/Priority2Code'
        instructed_amount:
          type: string
          minLength: 1
          maxLength: 34
          pattern: '^(?=.{1,19}$)[0-9]{0,18}(?:\.[0-9]{0,2})?$'
          example: '100.00'
        service_level:
          type: string
          description: Specifies a character string with a maximum length of 35 characters.
          minLength: 1
          maxLength: 35
          example: sct.05
        end_to_end_identification:
          type: string
          minLength: 1
          maxLength: 35
          example: ABC/4562/2020-09-30
          description: Specifies a character string with a maximum length of 35 characters.
        remittance_information_unstructured:
          minLength: 1
          maxLength: 280
          type: string
          description: Specifies a character string with a maximum length of 280 characters.
          example: This is a payment for 123456 invoice number.
        payment_purpose_code:
          $ref: '#/components/schemas/MandatePurpose1Code'
        category_purpose_code:
          $ref: '#/components/schemas/CategoryPurpose1Code'
        unique_superannuation_code:
          type: string
          pattern: '^[ -~]{1,35}$'
          description: Specifies a character string with a maximum length of 35 ASCII printable characters. Must provide the value as USI for the unique_superannuation_code.
          example: USI
        unique_superannuation_identification:
          type: string
          pattern: '^[ -~]{1,35}$'
          description: Specifies a character string with a maximum length of 35 ASCII printable characters.
          example: '60905115063003, STA0100AU'
        payroll_payment_date:
          type: string
          example: '2024-12-14'
          description: 'When Category Purpose Code is ''PENS'' and where the payment is for a super contribution or refund payment, this field will be populated with the payroll payment date. ''YYYY-MM-DD'' as local date.'
      title: MandatePaymentInstructionInitiationInformation1
      description: |-
        Mandate payment initiation information. 
         
        **Property descriptions**: 
         - **transaction_type** - Instruction source which is either 'Initiate Payment Instruction' or 'Receive Payment Instruction' 
         - **creation_date_time** - Date and time at which the message was created,UTC expressed without offset, i.e. YYYY-MM-DDThh:mm:ss.sssZ.
         - **instruction_identification** - Unique identification as assigned by an instructing party to unambiguously identify the payment instruction.
         - **instruction_priority** - Indicator of the urgency or order of importance that the instructing party would like the instructed party to apply to the processing of the instruction. 
         - **instructed_amount** - Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party. 
         - **service_level** - Payment Type Information Service Level Proprietary. Specifies a pre-agreed service or level of service between the parties, as a proprietary code. Specifies a NPP Back office service identification. 
         - **end_to_end_identification** - Unique identification assigned by the initiating party to unambiguously identify the transaction. This identification is passed on, unchanged, throughout the entire end-to-end chain. 
         - **remittance_information_unstructured** - Remittance Information Unstructured. Information supplied to enable the matching/reconciliation of an entry with the items that the payment is intended to settle, such as commercial invoices in an accounts' receivable system, in an unstructured form. 
         - **payment_purpose_code** - Payment Type Information Category Purpose Code. Underlying reason for the payment transaction.
         - **category_purpose_code** - Specifies the high level purpose of the mandate based on a set of pre-defined categories. 
         - **unique_superannuation_code** - Specifies the Name of the Identification scheme, in a free text form. For category_purpose_code = PENS, comments relating to USI - code indicating the identifier to whom the superannuation fund will be provided in this field. Must provide the value as USI.
         - **unique_superannuation_identification** - Specifies the Identification assigned by an institution. For category_purpose_code = PENS, comments relating to USI - the USI number for the superannuation fund will be provided in this field.
    MandatePaymentInstructionDebtorInformation1:
      type: object
      properties:
        party_name:
          pattern: '^[ -~]{1,140}$'
          type: string
          description: Specifies a character string with a maximum length of 140 ASCII printable characters.
          example: DEF Electronics
        ultimate_party_name:
          pattern: '^[ -~]{1,140}$'
          type: string
          description: Specifies a character string with a maximum length of 140 ASCII printable characters.
          example: JOE BLOGGS
        account_servicer_bic:
          type: string
          description: 'Code allocated to a financial institution by the ISO 9362 Registration Authority as described in ISO 9362: 2014 - Banking - Banking telecommunication messages - Business identifier code (BIC).'
          pattern: '^[A-Z0-9]{4,4}[A-Z]{2,2}[A-Z0-9]{2,2}[A-Z0-9]{3,3}$'
        account_identification_type_code:
          $ref: '#/components/schemas/MandateAccountIdentificationType1Code'
        account_identification:
          pattern: '^[ -~]{1,34}$'
          type: string
          description: Specifies a character string with a maximum length of 34 ASCII printable characters.
          example: '061245125574999'
        'account_alias_type_code':
          $ref: '#/components/schemas/MandateAccountAliasType1Code'
        account_alias_identification:
          type: string
          description: Specifies a character string with a maximum length of 2048 characters.
          minLength: 1
          maxLength: 2048
          example: mrsmith@hotmailtest.com
        full_legal_account_name:
          pattern: '^[ -~]{1,140}$'
          type: string
          description: Specifies a character string with a maximum length of 140 ASCII printable characters.
          example: ABC Corporation Pty Ltd
      title: MandatePaymentInstructionDebtorInformation1
      description: |-
        Mandate payment debtor party information. 
         
        **Property descriptions**: 
         - **party_name** - Debtor Name. Name of the Debtor party. 
         - **ultimate_party_name** - Ultimate Debtor Name. Name by which the ultimate debtor party is known and which is usually used to identify that party. 
         - **account_servicer_bic** - Debtor Agent Financial Institution Identification BICFI. Financial institution servicing an account for the debtor party.
         - **account_identification_type_code** - Debtor Account Identification Other Scheme Name Code. Debtor account identification type, in a coded form: 
           - BBAN - Basic Bank Account Number 
           - ALIA - Alias Identification 
         - **account_identification** - Debtor Account Identification Other Identification. Unique and unambiguous identification of the debtor account between the account owner and the account servicer. Account number with BSB prefix. 
         - **account_alias_type_code** - Debtor Account Proxy Type Proprietary. Debtor alias type, in a coded form as published in an external list. For example: 
         TELE - Telephone Number 
         EMAL - Email Address. 
         - **account_alias_identification** - Debtor Account Proxy Identification. Debtor alias identification, used to indicate the debtor account identification under another specified name. 
         - **full_legal_account_name** - Debtor Account Name. Name of the debtor account holder.
    MandatePaymentInstructionCreditorInformation1:
      type: object
      properties:
        party_name:
          pattern: '^[ -~]{1,140}$'
          type: string
          description: Specifies a character string with a maximum length of 140 ASCII printable characters.
          example: JOE BLOGGS
        ultimate_party_name:
          pattern: '^[ -~]{1,140}$'
          type: string
          description: Specifies a character string with a maximum length of 140 ASCII printable characters.
          example: JOE BLOGGS
        account_servicer_bic:
          type: string
          description: 'Code allocated to a financial institution by the ISO 9362 Registration Authority as described in ISO 9362: 2014 - Banking - Banking telecommunication messages - Business identifier code (BIC).'
          pattern: '^[A-Z0-9]{4,4}[A-Z]{2,2}[A-Z0-9]{2,2}[A-Z0-9]{3,3}$'
        account_identification_type_code:
          $ref: '#/components/schemas/MandateAccountIdentificationType1Code'
        account_identification:
          pattern: '^[ -~]{1,34}$'
          type: string
          description: Specifies a character string with a maximum length of 34 ASCII printable characters.
          example: '061245125574999'
        account_alias_type_code:
          $ref: '#/components/schemas/MandateAccountAliasType1Code'
        account_alias_identification:
          type: string
          description: 'Specifies a character string with a maximum length of 2048 characters. '
          minLength: 1
          maxLength: 2048
          example: mrsmith@hotmailtest.com
        full_legal_account_name:
          pattern: '^[ -~]{1,140}$'
          type: string
          description: Specifies a character string with a maximum length of 140 ASCII printable characters.
          example: ABC Corporation Pty Ltd
        party_reference:
          pattern: '^[ -~]{1,35}$'
          type: string
          description: Specifies a character string with a maximum length of 35 ASCII printable characters.
          example: my creditor reference
      title: MandatePaymentInstructionCreditorInformation1
      description: |-
        Mandate payment credit transfer transaction information. 
         
        **Property descriptions**: 
         - **party_name** - Creditor Name. Name by which creditor party is known and which is usually used to identify that party. 
         - **ultimate_party_name** - Ultimate creditor party to which an amount of money is due. 
         - **account_servicer_bic** - Creditor Agent Financial Institution Identification BICFI. Financial institution servicing an account for the creditor party.
         - **account_identification_type_code** - Creditor Account Identification Other Scheme Name Code. Creditor account identification type, in a coded form. For example: 
         BBAN - Basic Bank Account Number 
         ALIA - Alias Identification 
         - **account_identification** - Creditor Account Identification Other Identification. Unambiguous identification of the account of the creditor to which a credit entry will be posted as a result of the payment transaction. 
         - **account_alias_type_code** - Creditor Alias Type, in a coded form as published in an external list. For example: 
         TELE - Telephone Number 
         EMAL - Email Address 
         - **account_alias_identification** - Creditor Account Proxy Identification. Identification used to indicate the Creditor account identification under another specified name. 
         - **full_legal_account_name** - Creditor Account Name. Name of the creditor account holder. 
         - **party_reference** - Remittance Information Structured Creditor. Unique reference, as assigned by the creditor, to unambiguously refer to the payment transaction.
    MandatePaymentInstructionMandateInformation1:
      type: object
      required:
        - initiating_party_servicer_bic
        - initiating_party_name
        - mandate_identification
      properties:
        initiating_party_servicer_bic:
          type: string
          description: 'Code allocated to a financial institution by the ISO 9362 Registration Authority as described in ISO 9362: 2014 - "Banking - Banking telecommunication messages - Business identifier code (BIC)".'
          pattern: '^[A-Z0-9]{4,4}[A-Z]{2,2}[A-Z0-9]{2,2}[A-Z0-9]{3,3}$'
        initiating_party_name:
          pattern: '^[ -~]{1,140}$'
          type: string
          description: Specifies a character string with a maximum length of 140 ASCII printable characters.
          example: John Smith
        mandate_identification:
          type: string
          description: 'Universally Unique IDentifier (UUID) version 1, as described in IETC RFC 4122 "Universally Unique IDentifier (UUID) URN Namespace" without the 4 hyphen separators. For example: ''00000000000010008000000000000000'' instead of ''00000000-0000-1000-8000-000000000000'' (without quotes)'
          pattern: '^[a-f0-9]{12}1[a-f0-9]{3}[89ab][a-f0-9]{15}$'
          example: 747db4e0774b11eba907b95df9422fde
        mandate_verification_date_time:
          type: string
          description: An ISODateTime whereby all timezoned dateTime values are UTC.
          pattern: '^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]{1,3})?(?:Z)$'
          example: '2021-07-31T21:29:06Z'
        mandate_payment_information:
          allOf:
            - $ref: '#/components/schemas/MandatePaymentInformation1'
            - description: '<p>Set of characteristics detailing mandate payment information.</p>    <p><strong>Property descriptions:</p></strong>  <ul> <li><strong>payment_frequency</strong> - Regularity with which instructions are to be created and processed.<br>NPPA CX guideline:<br>  Describes the frequency within which payments MAY be initiated against this payment arrangement.<ul> <li>Short view: MUST</li><li> Detailed view: MUST</li></ul> Refer to cx_payment_frequency_label for label and cx_payment_frequency_display for display value</li>   <li><strong>payment_execute_not_before_time</strong> - Indicates that each execution of the mandate payment should not occur before a given time of that execution day.<br> NPPA CX guideline: <br>  Provides ability to specify that a payment does not get initiated before a given time of the defined execution date. SHOULD be displayed under Frequency  <ul> <li>Short view: MAY </li> <li>Detailed view: MUST </li></ul> Refer to cx_payment_execute_not_before_time_label for label  </li>  <li><strong>count_per_period</strong> - Qualifies the frequency in terms of the number of instructions to be created and processed during the specified period.<br>NPPA CX guideline:  <br><ul><li> Short view: MUST </li> <li>Detailed view: MUST </li></ul> Refer to cx_payment_frequency_label for label and cx_payment_frequency_display for display value SHOULD be combined with frequency </li>  <li><strong>point_in_time</strong> - Qualifies the frequency in terms of an exact point in time or moment within the specified period.<br>NPPA CX guideline:  <br><ul><li> Short view: MUST </li> <li>Detailed view: MUST </li></ul> Refer to cx_payment_frequency_label for label and cx_payment_frequency_display for display value  <br> SHOULD be combined with frequency </li>  <li><strong>payment_amount_type</strong> - Identifies the mandate payment arrangement.<br>NPPA CX guideline:  <br><ul><li> Short view: MAY </li> <li>Detailed view: SHOULD </li></ul>Refer to cx_payment_amount_type_label for label and cx_payment_amount_type_display for display value.</li>  <li><strong>first_payment_amount</strong> - Amount different from the payment amount, as it includes the costs associated with the first debited amount. <br>NPPA CX guideline:  <br><ul><li> Short view: SHOULD </li> <li>Detailed view: MUST </li></ul>Refer to cx_first_payment_amount_label for label<li><strong>last_payment_amount</strong> - Last payment amount different  to the payment amount.<br>NPPA CX guideline:  <br><ul><li> Short view: SHOULD </li> <li>Detailed view: MUST </li></ul>Refer to cx_last_payment_amount_label for label.<br> The last payment amount MAY be specified for instances where the final payment amount of an arrangement varies from the regular amount. </li>  <li><strong>amount</strong> - Fixed amount to be debited from the debtor''s account.<br>NPPA CX guideline:  <br><ul><li> Short view: MUST </li> <li>Detailed view: MUST </li></ul> Refer to cx_amount_label for label and cx_amount_display for display value </li>  <li><strong>maximum_amount</strong> - Maximum amount that may be paid from the debtors account, per instruction.<br>NPPA CX guideline:  <br><ul><li> Short view: MUST </li> <li>Detailed view: MUST </li></ul> Refer to cx_amount_label for label and cx_amount_display for display value </li>  <li><strong>first_payment_date</strong> - Date of the first payment predefined in mandate.<br>NPPA CX guideline:  </br><ul><li> Short view: SHOULD </li> <li>Detailed view: MUST </li></ul></li>  <li><strong>last_payment_date</strong> - Date of the last payment predefined in mandate.<br>NPPA CX guideline:  </br><ul><li> Short view: SHOULD </li> <li>Detailed view: MUST </li></ul></li></ul><p>    The following rules apply to this structure:</p> <p> PaymentAmountTypeRule: If `payment_amount_type` code is equal to value ''FIXE'' then `amount` must be present.</p>'
      title: MandatePaymentInstructionMandateInformation1
      description: |-
        Information on the mandate associated with the payment request. 
         
        **Property descriptions**: 
         - **initiating_party_servicer_bic** - Forwarding Agent Financial Institution BICFI. Payment Initiator institution BIC.
         - **initiating_party_name** - Initiating Party Name. The party that initiates the credit transfer on behalf of the debtor.
         - **mandate_identification** - ID of mandate related to payment instruction. 
         - **mandate_verification_date_time** - Date on which the credit transfer mandate has been verified.
    MandatePaymentInstructionReponseInformation1:
      type: object
      required:
        - transaction_status
      properties:
        transaction_status:
          $ref: '#/components/schemas/PaymentTransactionStatus1Code'
        transaction_status_reason_code:
          type: string
          description: Specifies a character string with a maximum length of 4 characters.
          minLength: 1
          maxLength: 4
          example: TM01
        transaction_identification:
          type: string
          description: Specifies a character string with a maximum length of 35 characters.
          minLength: 1
          maxLength: 35
          example: BANKNTSTXXXN20180501000000000000010
        acceptance_date_time:
          type: string
          description: An ISODateTime whereby all timezoned dateTime values are UTC.
          pattern: '^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]{1,3})?(?:Z)$'
          example: '2021-12-26T21:28:16.2Z'
        account_servicer_reference:
          type: string
          description: Specifies a character string with a maximum length of 35 ASCII printable characters.
          pattern: '^[ -~]{1,35}$'
          example: '12345'
      title: MandatePaymentInstructionReponseInformation1
      description: |-
        Details of response to mandate payment request. 
         
        **Property descriptions**: 
         - **transaction_status** - Transaction Status. 
         - **transaction_status_reason_code** - Status Reason Information Reason Code. Reject reason code, defining the reason for the transaction status. 
         - **transaction_identification** - Payment Clearing and Settlement Transaction ID.
         - **acceptance_date_time** - Date/Time the NPP Payment Initiation Request was 'accepted' by the Responding Participant. 
         - **account_servicer_reference** - Unique reference, as assigned by the account servicing institution, to unambiguously identify the instruction.
    PaymentInstructionSource1Code:
      type: string
      title: PaymentInstructionSource1Code
      enum:
        - MAPN
        - RAPN
      description: <p>Specifies the source of the payment instruction.</p><table><tr><td>Code</td><td>Definition</td></tr><tr><td>MAPN</td><td>Initiate Payment Instruction.</td></tr><tr><td>RAPN</td><td>Receive Payment Instruction.</td></tr></table>
      example: MAPN
    MandatePaymentInstructionSearchRequest1:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          pattern: '^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]{1,3})?(?:Z)$'
          description: An ISODateTime whereby all timezoned dateTime values are UTC.
          example: '2021-01-29T05:39:49Z'
        to:
          type: string
          pattern: '^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]{1,3})?(?:Z)$'
          description: An ISODateTime whereby all timezoned dateTime values are UTC.
          example: '2021-02-28T05:39:49.123Z'
        mandate_identification:
          type: string
          description: "Universally Unique IDentifier (UUID) version 1, as described in IETC RFC 4122 \"Universally Unique IDentifier (UUID) URN Namespace\" without the 4 hyphen separators.\r\nFor example: '00000000000010008000000000000000' instead of  '00000000-0000-1000-8000-000000000000' (without quotes)"
          pattern: '^[a-f0-9]{12}1[a-f0-9]{3}[89ab][a-f0-9]{15}$'
          example: 747db4e0774b11eba907b95df9422fde
        page_number:
          type: number
          minimum: 1
          default: 1
        page_size:
          type: number
          default: 200
          minimum: 1
          maximum: 200
      description: '<p>Search payment instruction request</p><p>Property descriptions:</p><ul><li><b>from</b> - From Date</li><li><b>to</b> - To Date which must be after From Date</li><li><b>mandate_identification</b> - ID of mandate whose details are to be retrieved.</li><li><b>page_number</b> - Page Number starting from 1</li><li><b>page_size</b> - Page Size</li></ul>'
    MandatePaymentInstructionSearchResponse1:
      type: object
      required:
        - payment_instruction_summary
      properties:
        payment_instruction_summary:
          type: array
          items:
            $ref: '#/components/schemas/MandatePaymentInstructionSummary1'
      title: MandatePaymentInstructionSearchResponse1
      description: |-
        Response to a successful mandate payment instruction search request.
         
        **Property descriptions**: 
         - **payment_instruction_summary** - Payment instruction list.
    MandatePaymentInstructionSummary1:
      type: object
      required:
        - creation_date_time
        - instruction_identification
        - instructed_amount
        - transaction_type
        - transaction_status
        - mandate_identification
      properties:
        creation_date_time:
          type: string
          description: An ISODateTime whereby all timezoned dateTime values are UTC.
          pattern: '^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]{1,3})?(?:Z)$'
          example: '2023-02-02T18:22:44.667Z'
        instruction_identification:
          type: string
          description: |-
            A unique Payment Instruction Identifier generated by the initiator. The payment identifier must follow the following fixed character pattern NPP guidelines: 

             1 to 11 : initiator BIC11 

             12 : fixed value 'I' 

             13 to 20 : YYYYMMDD 

             21 to 22 : fixed value '00' 

             23 to 34 : sequence number starting from 000000000001 

             35 : retry counter, always set to 0 unless it's a retry, retries start at 1.
          minLength: 1
          maxLength: 35
          example: BANKNTSTXXXI20180501000000000000010
        instructed_amount:
          type: string
          minLength: 1
          maxLength: 34
          pattern: '^(?=.{1,19}$)[0-9]{0,18}(?:\.[0-9]{0,2})?$'
          example: '100.00'
        transaction_type:
          $ref: '#/components/schemas/PaymentInstructionSource1Code'
        transaction_status:
          $ref: '#/components/schemas/PaymentTransactionStatus1Code'
        transaction_status_reason_code:
          type: string
          description: Specifies a character string with a maximum length of 4 characters.
          minLength: 1
          maxLength: 4
          example: TM01
        mandate_identification:
          type: string
          description: 'Universally Unique IDentifier (UUID) version 1, as described in IETC RFC 4122 "Universally Unique IDentifier (UUID) URN Namespace" without the 4 hyphen separators. For example: ''00000000000010008000000000000000'' instead of ''00000000-0000-1000-8000-000000000000'' (without quotes) '
          pattern: '^[a-f0-9]{12}1[a-f0-9]{3}[89ab][a-f0-9]{15}$'
      title: MandatePaymentInstructionSummary1
      description: |-
        Summary details of the payment instruction. 
         
        **Property descriptions**: 
         - **creation_date_time** - Date and time at which the message was created, UTC expressed without offset, i.e. YYYY-MM-DDThh:mm:ss.sssZ.
         - **instruction_identification** - Unique identification as assigned by an instructing party to unambiguously identify the payment instruction.
         - **instructed_amount** - Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.
         - **transaction_type** - Instruction source which is either 'Initiate Payment Instruction' or 'Receive Payment Instruction'
         - **transaction_status** - Transaction Status.
         - **transaction_status_reason_code** - Status Reason Information Reason Code. Reject reason code, defining the reason for the transaction status.
         - **mandate_identification** - ID of mandate related to payment instruction.
    CategoryPurpose1Code:
      title: CategoryPurpose1Code
      type: string
      description: <p>Specifies the high level purpose of the mandate based on a set of pre-defined categories </p> <table><tr><td>Code</td><td>Description</td></tr><tr><td>SALA</td><td>Salary Payments</td></tr><tr><td>PENS</td><td>Pension Payments</td></tr><tr><td>TAXS</td><td>Tax Payments</td></tr></table>
      enum:
        - SALA
        - PENS
        - TAXS
      example: SALA
    Error1:
      type: object
      title: Error1
      description: '<p>Specifies the generic status as a result of a method applied to a Resource.</p> <p><strong>Property descriptions</strong>:</p> <ul> <li><strong>error_code</strong> - Code specifying the status of the request.</li>  <li><strong>error_message</strong> - Contains additional information on the status useful for the developer of the consumer application.</li></ul>'
      required:
        - error_code
      properties:
        error_code:
          type: string
          minLength: 4
          maxLength: 14
          description: Specifies a character string of 14 characters.
          example: CUS.API.XXXXXX
        error_message:
          type: string
          minLength: 1
          maxLength: 1000
          description: Specifies a character string with a maximum length of 1000 characters.
          example: error description
    CountryOfResidence1:
      title: CountryOfResidence1
      pattern: '[A-Z]{2,2}'
      type: string
      example: NZ
      description: Country of Residence if the payer is an individual.
    AliasRequest1:
      title: AliasRequest1
      type: object
      properties:
        alias_type:
          allOf:
            - $ref: '#/components/schemas/AliasType1Code'
            - description: |-
                The type of the Alias.

                Valid values:

                 TELI: Telephone number

                 EMAL: Email address

                 AUBN: Australian Business Number

                 ORGN: Organisation Name
          example: EMAL
        alias_value:
          type: string
          description: The Alias Identifier Value
          example: bob@cuscal.com.au
      required:
        - alias_type
        - alias_value
    Alias1:
      title: Alias1
      required:
        - alias_details
      type: object
      properties:
        alias_details:
          allOf:
            - $ref: '#/components/schemas/AliasDetails1'
            - description: AliasDetails object will populated if the PayID resolution was successful.
    AliasDetails1:
      title: AliasDetails1
      type: object
      description: aliasDetails object will populated if the PayID resolution was successful.
      properties:
        identifier_type:
          allOf:
            - $ref: '#/components/schemas/IdentifierType1'
            - maxLength: 4
              minLength: 4
              description: |-
                The type of the Alias being resolved.

                Valid values:

                 TELI: Telephone number

                 EMAL: Email address

                 AUBN: Australian Business Number

                 ORGN: Organisation Name
        identifier_value:
          type: string
          description: The PayID of the resolved Alias E.g. an email address/ABN
          example: sam@cuscal.com.au
        name:
          type: string
          description: The name of the resolved alias
          example: Sam Smith
        servicer:
          maxLength: 11
          minLength: 11
          type: string
          description: The Account Servicer of the Account linked to the resolved Alias. Format is BIC11
          example: CUSCAL2SXXX
        account_identification:
          type: string
          description: 'The Account Identifier of the Account linked to the resolved Alias, i.e. BSB and Account Number, or Token.'
          example: '123456123456789'
        account_scheme_name_code:
          allOf:
            - $ref: '#/components/schemas/AccountSchemeName1Code'
            - maxLength: 4
              minLength: 4
              description: |-
                Code denoting the Account Identifier Scheme

                Valid values:

                 BBAN: BSB

                 AIIN: Card PAN
        account_issuer:
          maxLength: 6
          minLength: 6
          type: string
          description: The Issuer of the Account i.e. the BSB or BIN
          example: '123456'
        account_owner_name:
          type: string
          description: Full legal account name as allocated by the Account Servicer based on Know Your Customer procedures
          example: MR SAM SMITH
        registration_date_time:
          type: string
          description: 'Date/time at which this Alias record was registered. UTC expressed without offset, i.e. YYYY-MM-DDThh:mm:ss.sssZ'
          format: date-time
        lastUpdated_date_time:
          type: string
          description: 'Date/time at which this Alias record was last updated. UTC expressed without offset, i.e. YYYY-MM-DDThh:mm:ss.sssZ'
          format: date-time
        BO_service:
          type: array
          description: |-
            List of NPP BO services supported by the resolved account issuer

            Tag is repeated as many times as required to return
            the full list of services that are supported by both the Account Servicer and the calling participant.

            Where multiple versions are supported the highest
            version will be returned.
          items:
            $ref: '#/components/schemas/BO_Service1'
      required:
        - identifier_type
        - identifier_value
        - name
        - servicer
        - account_identification
        - account_scheme_name_code
        - account_issuer
        - account_owner_name
        - registration_date_time
        - lastUpdated_date_time
        - BO_service
    BO_Service1:
      title: BO_Service1
      required:
        - service
        - available
      type: object
      properties:
        service:
          allOf:
            - $ref: '#/components/schemas/Service1'
            - description: |-
                List of NPP BO services supported by the resolved account issuer
                Example values are:
                - sct.05
                - catsct.02
                - sctxbrdr.02 etc

                Tag is repeated as many times as required to return
                the full list of services that are supported by both the Account Servicer and the calling participant.

                Where multiple versions are supported the highest
                version will be returned
        available:
          allOf:
            - $ref: '#/components/schemas/Available1'
            - description: |-
                The current particapant/BIC/service available status.

                **Availablity**                                |

                |Code|Code Name |description|
                |------|----|----|
                |PA01|ParticipantAvailable|A Participant's Back Office has previously been experiencing issues and is now processing normally|
                |PA02|ParticipantFlooded|A Participant is experiencing Back Office issues and is operationally flooded by an excessive number of messages |
                |PA03|ParticipantRecovering|A Participant was experiencing Back Office issues and is recovering from a flooded or under stress state|
                |PA04|ParticipantNotAvailable|A Participant's Back Office is operationally unavailable|
    AccountSchemeName1Code:
      title: AccountSchemeName1Code
      enum:
        - BBAN
        - AIIN
      type: string
      description: |-
        Code denoting the Account Identifier Scheme
        Valid values:
         BBAN: BSB
         AIIN: Card PAN
    AliasType1Code:
      title: AliasType1Code
      enum:
        - TELI
        - EMAL
        - AUBN
        - ORGN
      type: string
      description: |-
        Type of the Alias being registered or updated or enquired.
        Valid values include:
         TELI - Telephone
         EMAL - Email
         AUBN - Australia Business Number
         ORGN - Organisation ID
      example: EMAL
    Available1:
      title: Available1
      enum:
        - PA01
        - PA02
        - PA03
        - PA04
      type: string
      description: The current particapant/BIC/service available status.
    IdentifierType1:
      title: IdentifierType1
      enum:
        - TELI
        - EMAL
        - AUBN
        - ORGN
      type: string
      description: |-
        The type of the Alias being resolved.
        Valid values:
         TELI: Telephone number
         EMAL: Email address
         AUBN: Australian Business Number
         ORGN: Organisation Name
      example: EMAL
    Service1:
      title: Service1
      type: string
      example: sct.05
      description: |-
        List of NPP BO services supported by the resolved account issuer
        Example values are:
        - sct.05, catsct.02, sctxbrdr.02 etc
        Tag is repeated as many times as required to return
        the full list of services that are supported by both the Account Servicer and the calling participant.
        Where multiple versions are supported the highest
        version will be returned
    BO_Services1:
      title: BO_Services1
      description: List of NPP BO services and their availability supported by the resolved account issuer
      required:
        - BO_Service
      type: object
      properties:
        BO_Service:
          type: array
          items:
            $ref: '#/components/schemas/BO_Service1'
