        - original_transaction_identification
        - returned_amount
        - return_reason_code
      properties:
        case_identification:
          maxLength: 34
          type: string
          description: |-
            The unique Id assigned to the case by Cuscal's dispute system.
            If request to return fund is solicited this should be provided otherwise could be blank
          example: TMBAAUTSE2EC2018071100000000000001
        original_message_identification:
          maxLength: 34
