openapi: 3.0.0
info:
  title: NPP Payments API
  description: |-
    This document represents the Technical Interface Specification for the Payments API. This API exposes functionality to:

     **Payments**:
     - Make Payment: Initiate a domestic credit transfer from one account to another account or PayID.
     - Make PayTo Payment: Initiate a credit transfer on the back of a Mandate Payment Initiation Request.
     - Get Payment: Retrieve detailed information for a specific domestic NPP or PayTo Payment.
     - Make IFTI Payment: Initiate a credit transfer for final domestic leg of received IFTI payment.
     - Get IFTI Payment: Retrieve detailed information for a specific IFTI Payment.
     - Get Payment Status: Retrieve the current status of a payment.
     - Update Payment Status: Update the status of a payment (internal use, e.g. fraud engine).
     - Return Payment: Return a payment previously received.
     - Return IFTI Payment: Return a payment originally received by IFTI(sctxbrdr) service.
     - Clear Payment: Clear the payment in real time, applicable for institutions performing their own clearing.
     

     **Payment Validation**:
     - Resolve Alias: Resolve PayID aliases to account details.
     - Get Issuer BO Services: Retrieve back-office services supported by payee's BSB.
     - Get Issuers BO Services: Returns a list of institution's BSB(s) and supported services

     **Payments Initiation**:
     - Make Payment Initiation: Initiate the mandate payment requests by the initiator/creditor.
     - Get Payment Initiation Status: Retrieve the payment instruction details based on the instruction id.
     - Search Payment Instructions: Search for the payment instructions based on the date filters and mandateId.
     - Get Payment Instruction: Retrieve the payment instruction details based on the instruction id.

     _Note: Endpoints associated with Payments Initiation are only available to Initiators._
     
     **Changes in v4.0.3**
    
     This release introduces the following updates:

    - Enhanced sanctions_information guidance to require at least one sanctions-related identifier pertaining to Domestic Debtor for screening purposes. E.g., Address or Date/Place of Incorporation or ABN.

    - Removed pattern validation for payment_purpose_code field in Make Payment operation.
    
    **Changes in v4.0.2**
     
     This release introduces the following updates:
    
    - Added mandate_identification (mandatory) to Make Payment Initiation (MAPAIN).
    - Added payroll_payment_date (optional) to Make Payment Initiation (MAPAIN) and Get Payment Instruction.
    - Added account_identification_issuer (optional) for overseas debtor accounts within ifti_information in IFTI endpoints.
    - Removed full_legal_account_name from creditor_information in Make Payment Initiation(MAPAIN).
    - Updated length for account_identification in debtor_information for IFTI endpoints.
    - Updated minor descriptions/guidances for fields including unique_superannuation_code, unique_superannuation_identification, merchant_category_code, batch_identification, and number_of_transactions, and updated Clear Payment endpoint summary description.
    - Updated pattern validations for transaction_identification, original_transaction_identification (Get Payment, Get Payment Status), and payroll_payment_date.
    - Corrected operationId values for Return Payment and Return IFTI Payment to align with the corresponding API names.

     **Changes in v4.0.1**
    
    This release introduces non‑breaking enhancements with no new or removed endpoints. Version 4.0.1 improves specification accuracy, consistency, and compliance through additional optional data elements, standardised asynchronous response behaviour, enhanced audit and fraud header definitions, strengthened validations, and alignment updates for IFTI payments, with no impact to existing client integrations.

    _For a comprehensive view of all updates introduced in v4.0.1, please refer to the attached **OAS 4.0.1 Change Log.pdf** file included in the OAS pack._
    
    **Changes in v4.0.0**:

    **Payments**:
    
     Existing Make Payment API now split into three separate endpoints for domestic, international and mandate payment.

     - New Operations added: 
        - Make PayTo payment, Make IFTI payment, Get IFTI payment, Return IFTI payment, Clear Payment
     - Field level updates (Make Payment):
        - service_level field updated to accept only service name values, service versions are now removed. Therefore, valid values updated to ('sct','x2p1','catsct') replacing ('sct.04','x2p1.04','catsct.01').
        - payment_information block updated to include new field payroll_payment_date, applicable for Superannuation payments.
        - payment_information block updated to include new field country_of_origin, as an IFTI misrouting control.
        - sanctions_information block updated to include richer address data (optional) - bldg_name, floor, post_box, room, town_location, district_name.
        - x-instruction-priority is now made mandatory.
        - x-auditInfo-endUserSessionId is now made mandatory.
        - ifti_information and related content moved out to dedicated Make IFTI Payment endpoint
        - mandate_information and related content moved out to dedicated Make PayTo Payment endpoint.
        
      - Field level updates (Make PayTo Payment):
        - Various elements previously sourced from Received Payment Instruction (RAPAIN) have been removed from the API and will now be enriched directly by Cuscal.
        
      - Field level updates (Make IFTI Payment and Get IFTI Payment):
        - Various elements are moved from ifti_information.creditor_agent_instruction to its equivalent NPP elements to align with Message Usage Guidelines.
        - Blocks containing details for the domestic leg and overseas transactions have been clearly segregated to provide a logical distinction between        NPP-specific data and overseas payment details. For instance, debtor_information block captures NPP domestic leg debtor details, and  ifti_information.debtor block captures overseas transaction debtor details.
        
      - Field level updates (Get Payment):
        - payment_information block enhanced to return new fields added in Make Payment i.e. payroll_payment_date and sanctions_information details.
        - debtor_information and creditor_information block enhanced to return alias fields account_alias_type_code and account_alias_identification, where applicable.
        - creditor_information block enhanced to return merchant_category_code and ultimate_party_merchant_category_code where applicable.
        - batch_identification block added to provide batch identification where applicable.
     - Field level updates (Return Payment):
        - payment_return_request_information block updated for return_additional_information occurences change from 3 to 10.
        - sanctions_information block updated to include richer address data (optional) - bldg_name, floor, post_box, room, town_location, district_name. 
        - x-instruction-priority is now made mandatory.
        
      - Field level updates (Alias Resolution, Get Issuer BO Services):
        - x-auditInfo-endUserSessionId header is now made mandatory.

     **Payment Initiation**:
     
     - Field level updates (Make Payment Initiation, Get Payment Instruction):
        - payment_information block updated to include merchant_identification.
        - creditor_information block updated to include merchant_category_code, ultimate_party_merchant_category_code and full_legal_account_name.
        - New batch_information block added with inclusion of new fields batch_identification, number_of_transactions, batch_amount and batch_id_expiry.
        - mandate_information block updated to return payment_frequency, count_per_period, point_in_time, payment_amount_type for Get Payment Instruction operation.
        - x-instruction-priority is now made mandatory.
        
    **API Design and Standardisation**: 
    - **Unified Specification:**
      - All capabilities for Payments, Payments Validation and Payments Initiation  are consolidated into a single unified specification for streamlined integration.
    - **Consistent Path Structure**:
      - Paths standardised under /npp/payments/v4/ replacing /npp/payments/v2/, npp/aliases/resolution/v2, npp/institutions/v2, npp/mandates/payments/payer/v2 and npp/mandates/payments/initiator/v2, 
      - Common path parameter orgId introduced for all operations replacing initgPtyIdOrgId.
    - **Error Handling Standardisation**: 
      - All operations now include detailed error tables for 400, 401, 404, 408, 429, and 503 responses (where applicable), replacing generic messages.

    When a payment is to a PayID, it is recommended to perform Alias Resolution before initiating Make a Payment. When a payment is to a BSB/Account number, it is optional to resolve BSB via Get Issuer BO Services operation before making a Payment.

    The API is designed for integration with banking systems, enabling secure, compliant, and efficient payment flows across the New Payments Platform (NPP).

