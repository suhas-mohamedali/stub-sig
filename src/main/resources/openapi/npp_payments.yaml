components:
  schemas:
    NppSanctionsData1:
      title: NppSanctionsData1
      x-stoplight:
        id: d3fa49ae8f99c
      type: object
      properties:
        date_of_birth:
          type: string
          description: Date of Birth of the Payer, format YYYY-MM-DD
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
          example: '1965-05-12'
        place_of_birth:
          maxLength: 35
          minLength: 1
          type: string
          description: Place of Birth of the Payer
          example: Sydney
        date_of_incorporation:
          type: string
          description: Date of Incorporation if the payment is made by a non-individual, format YYYY-MM-DD
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
          example: '1970-01-15'
        place_of_incorporation:
          maxLength: 35
          minLength: 1
          type: string
          description: Place of Incorporation if the payment is made by a non-individual
          example: NSW
        business_abn:
          maxLength: 11
          minLength: 9
          pattern: '^((\d{9})|(\d{11}))$'
          type: string
          description: Australian Business Number
          example: '41824753556'
        address:
          allOf:
            - $ref: '#/components/schemas/NppAddress1'
            - description: |-
                This represents address of an individual or non-individual customer of a NPP participant. This object could be populated in one of formats below:

                1. Structured address (i.e. Elements: Address Type through Country)  
                2. Unstructured address (i.e. Address Line(s) + optional Country Code)
                3. Unstructured address (i.e. Address Line(s) + optional Country Code) and one or more of the following structured address elements:
                      - Suburb (`<town_name>`)
