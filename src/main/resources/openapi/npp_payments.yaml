    GetTransactionStatusInformation1:
      title: GetTransactionStatusInformation1
      required:
        - transaction_status
        - acceptance_date_time
        - settlement_method_identification
      type: object
      properties:
        transaction_status:
          maxLength: 4
          minLength: 4
          type: string
          description: |-
            Transaction status. Valid values: 
            - 'PDNG' (Payment is still pending i.e. in processing)
            - 'ACCP' (Payment is accepted for clearing)
            - 'RJCT' (Payment is rejected - includes reason)
            - 'ACSC' (Payment is successfully settled)
            - 'ACWC' (Payment was manually settled)
          example: ACSC
        transaction_status_reason_code:
          maxLength: 4
          minLength: 4
          type: string
          description: Payment status reason code. Only applicable if transaction_status = RJCT or PDNG
          example: AC07
        acceptance_date_time:
          type: string
          description: The date and time when the payment was settled.
          format: date-time
          example: '2018-05-11T04:12:01.198Z'
        update_date_time:
          type: string
          example: '2020-09-07 15:12:04.028994'
        posting_flag:
          type: string
          description: Posting Status of the payment. Valid values:'PSTG'- the payment is accepted and posting expected within SLA, 'PSTY'- the payment is accepted and posting expected to be delayed, 'PSTD'- the payment is accepted and posted
          enum:
            - PSTG
            - PSTY
            - PSTD
          example: PSTG
        settlement_method_identification:
          allOf:
            - $ref: '#/components/schemas/SettlementMethodIdentification1'
            - maxLength: 4
              minLength: 4
              description: |-
                Cuscal settlement method. Valid values:
                - OFFU    (Off Us)
                - CCOM  (Cuscal Community)
                - ONUS   (On Us)

                It will be present when a Payment response is received from BI.
        settlement_batch_identification:
          maxLength: 32
          type: string
          description: Hourly Batch Identification of the Payment
          example: 20200908-01
    ClearingStatusInformation1:
      title: ClearingStatusInformation1
      type: object
      required:
        - transaction_status
      properties:
        transaction_status:
          example: ACCP
          description: |2-
                          Transaction status. Valid values: 
                        - 'ACCP' (Payment is accepted for clearing)
                        - 'RJCT' (Payment is rejected - includes reason)
          enum:
            - ACCP
            - RJCT
        transaction_status_reason_code:
          maxLength: 4
          minLength: 4
          type: string
          example: AC07
          description: Payment rejection reason code. Only applicable if transaction_status = RJCT
        acceptance_date_time:
          type: string
          description: The date and time when the clearing was accepted. Only applicable if transaction_status = ACCP
          format: date-time
          example: '2024-05-11T04:12:01.198Z'
        posting_flag:
          description: "Posting Status of the payment. Only applicable if transaction_status = ACCP\r\n          Valid values:\r\n          -'PSTG' (the payment is accepted and posting expected within SLA)\r\n         -'PSTY' (the payment is accepted and posting expected to be delayed) \r\n         -'PSTD' (the payment is accepted and posted)"
          enum:
            - PSTG
            - PSTY
            - PSTD
    GetPaymentInformation1:
      title: GetPaymentInformation1
      required:
        - transaction_type
        - creation_date_time
        - transaction_identification
        - instructed_amount
        - service_level
        - end_to_end_identification
      type: object
      properties:
        transaction_type:
          allOf:
            - $ref: '#/components/schemas/TransactionType1'
            - maxLength: 4
              description: Type of the payment(MAP/RAP/MAPR/RAPR)
              example: MAP
        creation_date_time:
          type: string
          description: 'Message creation date and time in UTC format eg: YYYY-MM-DDThh:mm:ss.sssZ'
          format: date-time
          example: '2025-05-11T04:13:41.667Z'
        transaction_identification:
          maxLength: 35
          minLength: 35
          type: string
          description: |-
            A unique Payment Transaction Identifier generated by the Payer. The payment identifier must follow the following fixed character pattern NPP guidelines:
             - 1 to 11     Payer BIC11
             - 12             fixed value 'N'
             - 13 to 20   YYYYMMDD
             - 21 to 22   fixed value '00'
             - 23 to 34   sequence number starting from 000000000001
             - 35             retry counter, always set to 0 unless its a retry, retries start at 1.
          example: BANKNTSTXXXN20180501000000000000010
        instructed_amount:
          allOf:
            - $ref: '#/components/schemas/Amount1'
            - description: Transaction Amount
        service_level:
          type: string
          description: Payment method indicating the NPP service under which Cuscal processed this Payment.
          minLength: 1
          maxLength: 35
          example: sct.05
        end_to_end_identification:
          maxLength: 35
          type: string
          description: |-
            End to End identifier. This is the Debtor's (customer) reference for the Payment to be provided to Creditor (customer). 

            End to End is used as guidance text for Payer channels in the use of the Reference (EndToEndId) field. 

            If the payer populates the details in the channel, the the same is passed on to the payee.  

            If the payer does not populate, the default value will apply.
          example: ABC/4562/2018-04-08
        remittance_information_unstructured:
          maxLength: 280
          type: string
          description: |-
            Payment Description
            For category_purpose_code = SALA, comments relating to specific employee information will be provided in this field.
          example: This is a payment for invoice number 123456.
        category_purpose_code:
          maxLength: 4
          minLength: 4
          type: string
          description: |-
            Payment Category code 
            Download the 'External Code Sets' spreadsheet from https://www.iso20022.org/external_code_list.page and navigate to the '4-CategoryPurpose' tab for a full list of payment Category codes.
            "EPAY", "SALA", "SUPP", "PENS", "TAXS"
          example: EPAY
        payroll_payment_date:
          type: string
          example: '2024-12-14'
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
          description: 'When Category Purpose Code is ''PENS'' and where the payment is for a super contribution or refund payment, this field will be populated with the payroll payment date. ''YYYY-MM-DD'' as local date.'
        unique_superannuation_code:
          type: string
          example: 'USI'
          description: 'For category_purpose_code = PENS, comments relating to USI code indicating the identifier to whom the superannuation fund will be provided in this field. Must provide the value as USI for the unique_superannuation_code.'
        unique_superannuation_identification:
          type: string
          example: '60905115063003, STA0100AU'
          description: 'For category_purpose_code = PENS, comments relating to USI. The USI number for the superannuation fund will be provided in this field.'
    GetPaymentReturnInformation1:
