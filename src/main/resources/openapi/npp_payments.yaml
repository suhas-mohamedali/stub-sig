          example: CUSCAU2SXXX20180529000000000004077
        original_end_to_end_identification:
          maxLength: 34
          type: string
          description: End to End Id of the original payment
          example: NOTPROVIDED
        original_transaction_identification:
          maxLength: 35
          minLength: 35
          type: string
          description: Transaction Id of the original Payment
          example: TMBAAUTSE2EN20180529TM0001118209610
        full_legal_account_name:
          maxLength: 140
          type: string
          description: Full legal account name of the Payee Participant, must be populated while initiating a return.
          example: ABC Corporation Pty Ltd
        returned_amount:
          type: string
          description: |-
            Amount of the original transaction

            For unsolicited should be the original amount and solicited could be less than or equal to original amount.
          example: '41.78'
        return_reason_code:
          maxLength: 4
          minLength: 4
          type: string
          description: Reason for the return must be populated for a Solicited and Unsolicited Payment Return.Participant to indicate why the Payment Return (pacs.004) is being made.
          example: FOCR
        return_additional_information:
          maxItems: 10
          type: array
          description: 'AdditionalInformation must be populated when the return reason codes are either NARR or FOCR. Up to 10 occurrences are permitted in the message. If RtrRsnInf/Rsn/Cd = ''NARR'' (Narrative), at least one instance of RtrRsnInf/AddtlInf must be present. If return_reason_code = ''FOCR'' (Following Cancellation Request) then the cancellation request case number must be expressed in one instance of RtrRsnInfAddtlInf, prefixed with ''/CASE/'' starting in position 1.'
          items:
            type: string
    PaymentReturnInformation1:
      title: PaymentReturnInformation1
      type: object
      properties:
