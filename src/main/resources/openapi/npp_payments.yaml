  '/{orgId}/initiator/instructions/{pmtIdInstrId}':
    post:
      tags:
        - Payment Initiation
      summary: Make Payment Initiation
      description: |
        <p>The purpose of this operation is to initiate the mandate payment requests by the initiator/creditor.</p><p>The payment initiation request from initiator is sent to the payment engine which does the validations and sends the payment acceptance status back. </p><p>Request will be validated and forwarded to the Payer institution to initiate the payment clearing and settlement. Cuscal will wait for a short period before returning the response, so that payment transaction is processed and settled.  </p><p>Various transaction status (transaction_status) returned by this operation are listed below. There are two types of transaction status. </p><p>In-progress  </p><ul><li> SENT (SentToPayer) - Payment initiation request sent to Payer participant, but Payment Status Report not received yet.  </li><li> SAFD (ParticipantDown) - Either Payer or Payee participant is not available. Payment initiation request is placed into Cuscal's store-and-forward queue and will be reattempted when participants are available.  </li><li> ACCP (AcceptedCustomerProfile) - Payment initiation request is accepted by Payer participant.   </li><li> ACSP (AcceptedSettlementPending) - Payment initiation request is accepted by Payer Participant, payment is cleared and not yet settled. </li></ul><p>Final state </p><ul><li>ACSC (AcceptedSettlementCompleted) - Payment is cleared and settled. </li><li> RJCT (Rejected) - Payment initiation request is rejected by either Cuscal or Payer, or payment rejected during clearing and settlement. Refer to reason code for details.  </li></ul><p>In most cases this operation will return one of final state transaction status. However, when this operation returns an in-progress status, use Get Mandate Payment Status operation to periodically check the payment status until a final state is reached.  <p><b>Retrying a payment initiation request: </b><p>Initiator can retry the payment initiation for requests rejected with below reject reasons: <li>AB01     AbortedClearingTimeout</li> <li>AB02     AbortedClearingFatalError</li> <li>AB03     AbortedSettlementTimeout</li> <li>AB04     AbortedSettlementFatalError</li> <li>AB08     OfflineCreditorAgent</li> <li>AC06     BlockedAccount</li> <li>AG07     UnsuccessfulDirectDebit</li> <li>AM04     InsufficientFunds</li> <li>AM21     LimitExceeded</li> <li>FF10     BankSystemProcessingError</li> <li>NARR     Narrative</li> <li>SL13     Maximum number of Direct Debit Transactions exceeded</li> <li>SL14     Maximum Direct Debit Transaction Amount exceeded</li> <li>TD03     IncorrectFileStructure</li> <li>TM01     InvalidCutOffTime</li> </ul><p>When the payment initiation needs to be retried then the initiator must generate a new unique instruction id by incrementing the 35th character ("Retry Counter") of an existing instruction ID (instruction_identification). </p><p>The Retry Counter starts at 1 to 9 and then A to Z. </p>
      operationId: post-orgId-make-payment-initiation
      parameters:
        - name: pmtIdInstrId
          in: path
          description: 'Unique identification generated by the Initiator, must be same as the payment_information.instruction_identification in the request body.'
          required: true
          style: simple
          schema:
            type: string
            example: BANKNTSTXXXI20180501000000000000010
        - name: orgId
          in: path
          description: |-
            orgId is the BIC11 of the institution sending the payment instruction to Cuscal.

            [MaxLength=11]
            [pattern=^[A-Z0-9]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$]
          required: true
          style: simple
          schema:
            maxLength: 11
            type: string
            pattern: '^[A-Z0-9]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$'
            example: CUSCAU2SXXX
        - $ref: '#/components/parameters/x-instruction-priority'
        - $ref: '#/components/parameters/x-traceId'
        - $ref: '#/components/parameters/x-auditInfo-auditNote'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-vpn'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-cookies'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-torMode'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-fraudScore'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-geoLocation'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-browserAgent'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-branchTerminalNumber'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-imeiNumber'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-deviceFingerprint'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-ipAddress'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-channelType'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-authenticationMethod'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-userId'
        - $ref: '#/components/parameters/x-auditInfo-fraudInfo-customerNumber'
        - $ref: '#/components/parameters/x-auditInfo-endUserId'
        - $ref: '#/components/parameters/x-auditInfo-applicationId'
      requestBody:
        description: Request to resolve a pending action on a mandate.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MandatePaymentInitiationRequest1'
        required: true
      responses:
        '202':
          description: 'The request has been accepted for processing, but the processing has not been finished yet'
          headers:
            x-traceId:
              $ref: '#/components/headers/x-traceId'
          content: {}
        '400':
