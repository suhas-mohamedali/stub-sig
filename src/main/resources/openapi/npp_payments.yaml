          type: string
          description: 'The issuer of the Account, i.e. the BSB (BBAN) or BIN(card). This field has got only the following chars allowed: 0-9 and *'
          example: '802950'
    Scheme1:
      title: Scheme1
      enum:
        - BBAN
        - AIIN
      type: string
      description: |-
        <p>Specifies the type of account identification.</p>
        |Code|Description|
        |-|-|
        |BBAN|Basic Bank Account Number|
        |AAIN|PAN/Card Number|
    PartyType1:
      title: PartyType1
      enum:
        - NIND
        - INDV
      type: string
      description: |-
        Debtor account type.
        Valid values:
        - INDV (individual)
        - NIND (non-individual)
  parameters:
    x-auditInfo-applicationId:
      name: x-auditInfo-applicationId
      in: header
      description: Identifies the application that generated the message. It is recommended that the application version and location are also recorded in this field.
      required: true
      schema:
        maxLength: 50
        minLength: 1
        type: string
        example: Internet Banking v1.0
    x-auditInfo-endUserId:
      name: x-auditInfo-endUserId
      in: header
      description: Identifies the entity who initiated the operation. For example, provide the Customer ID in case of Individual, or Merchant ID in case of Non-Individual.
      required: true
      schema:
        maxLength: 50
        minLength: 1
        type: string
        example: '123456'
    x-auditInfo-fraudInfo-customerNumber:
      name: x-auditInfo-fraudInfo-customerNumber
      in: header
      description: |-
        Uniquely identifies the Customer for whom the request has been initiated for. i.e. the Customer that owns the account. This field should contain the Member Number or Customer Number from the Client's banking system.
        [Mandatory if supplying any fraud fields.]
      schema:
        maxLength: 25
        type: string
        example: '1064983'
    x-auditInfo-fraudInfo-userId:
      name: x-auditInfo-fraudInfo-userId
      in: header
      description: |-
        Uniquely identifies the User that has initiated the request. This could be the Customer or someone authorised to act on behalf of the Customer. The value could be a Staff ID, Member Number or Customer Number.
        [Mandatory if supplying any fraud fields.]
      schema:
        maxLength: 255
        type: string
        example: '1064983'
    x-auditInfo-fraudInfo-authenticationMethod:
      name: x-auditInfo-fraudInfo-authenticationMethod
      in: header
      description: "This field allows us to understand how the user has logged in. Over a period we can determine if there is a deviation from normal usage patterns. e.g. Moving from biometric to PIN and linking that with payments we can detect fraud happening but also apply other rules to understand if PayIds are being from a device for malicious intent. \nSet the highest level of authentication reached before this request was sent. Must be one of the following (listed in most trustworthy to least\n-\t2FA (2 Factor Authentication) \n-\tOTP (One time password) \n-\tBIO (Biometric) \n-\tPWD (Password) \n-\tPIN \n-\tNON (None) \n\n[Mandatory if supplying any fraud fields.]\n\n[MaxLength=3]\n\n[MinLength=3]"
      schema:
        type: string
        enum:
          - OTP
          - BIO
          - PWD
          - PIN
          - NON
          - 2FA
    x-auditInfo-fraudInfo-channelType:
      name: x-auditInfo-fraudInfo-channelType
      in: header
      description: "This field allows us to understand, similar to authenticationMethod, which channels are being used to initiate a request. This can be compared to regular usage patterns.\nThe type of channel the request initiated from. Must be one of : \n-\tINT (Internet Browser) \n-\tMOB (Mobile Application) \n-\tBRA (Branch) \n-\tIVR (Interactive Voice Response) \n-\tOTR (Other) \n\n[Mandatory if supplying any fraud fields.]\n\n[MaxLength=3]\n\n[MinLength=3]"
      schema:
        type: string
        enum:
          - BRA
          - INT
          - MOB
          - IVR
          - OTR
    x-auditInfo-fraudInfo-ipAddress:
      name: x-auditInfo-fraudInfo-ipAddress
      in: header
      description: 'IP address of the device or computer from which the user request originated. \nRequired if request originated from a browser or mobile, else do not send.'
      schema:
        maxLength: 50
        type: string
        example: 192.168.2.1
    x-auditInfo-fraudInfo-deviceFingerprint:
      name: x-auditInfo-fraudInfo-deviceFingerprint
      in: header
      description: |-
        The device fingerprint or browser fingerprint. 
        A change in device is a possible indicator of fraud/ID takeover/phone number porting. The device fingerprint, machine fingerprint or browser fingerprint. 
        Required if the request originated from a web browser or mobile device, else do not send.
      schema:
        maxLength: 255
        type: string
        example: finger-print-hash
    x-auditInfo-fraudInfo-imeiNumber:
      name: x-auditInfo-fraudInfo-imeiNumber
      in: header
      description: |-
        Mobile Phone IMEI ID. 
        Required if the request originated from a mobile device, else do not send.
      schema:
        maxLength: 15
        type: string
        example: '359708829853261'
    x-auditInfo-fraudInfo-branchTerminalNumber:
      name: x-auditInfo-fraudInfo-branchTerminalNumber
      in: header
      description: |-
        Branch terminal ID. 
        Optional for requests originating from branch terminals, else do not send.
      schema:
        maxLength: 25
        type: string
        example: '44'
    x-auditInfo-fraudInfo-browserAgent:
      name: x-auditInfo-fraudInfo-browserAgent
      in: header
      description: |-
        User Agent string from browser. 
        Required for all requests originating from a web browser, else do not send.
      schema:
        maxLength: 2048
        type: string
        example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
    x-auditInfo-fraudInfo-geoLocation:
      name: x-auditInfo-fraudInfo-geoLocation
      in: header
      description: |-
        Latitude and Longitude from which the user request originated.
        Format: <Lat>,<Long>
        Eg: -33.8708464,151.20732999999998 
        Only to be provided if GPS is enabled on the device, else do not send.

        [MaxLength=50]
      schema:
        maxLength: 50
        type: string
        example: '-33.8708464,151.20732999999998'
    x-auditInfo-fraudInfo-fraudScore:
      name: x-auditInfo-fraudInfo-fraudScore
      in: header
      description: 'The fraud score calculated by the client (if a client has calculated their own score). If a client does not have an internal fraud system and thus does not have an internal score, do not send'
      schema:
        maxLength: 50
        pattern: '[0-9]+'
        type: string
        example: '70'
    x-auditInfo-fraudInfo-torMode:
      name: x-auditInfo-fraudInfo-torMode
      in: header
      description: "Identifies whether the request is coming from a TOR enabled network. Only send this tag if the Client / Connector can determine if true or false, else do not send. \nValid values are: \n-\ttrue \n-\tfalse"
      schema:
        type: string
        enum: ["true", "false"]
        example: 'false'
    x-auditInfo-fraudInfo-cookies:
      name: x-auditInfo-fraudInfo-cookies
      in: header
      description: "Identifies whether cookies are enabled in the user's browser. Only send this tag if the Client / Connector can determine if true or false, else do not send. \nValid values are:\n-\ttrue \n-\tfalse"
      schema:
        type: string
        enum: ["true", "false"]
        example: 'true'
    x-auditInfo-fraudInfo-vpn:
      name: x-auditInfo-fraudInfo-vpn
      in: header
      description: "Identifies whether the request is coming from a VPN. Only send this tag if the Client / Connector can determine if true or false, else do not send. \nValid values are:\n-\ttrue \n-\tfalse"
      schema:
        type: string
        enum: ["true", "false"]
        example: 'false'
    x-auditInfo-auditNote:
      name: x-auditInfo-auditNote
      in: header
      description: Free text field.
      schema:
        maxLength: 2048
        type: string
        example: Confirmed by Customer
    x-auditInfo-endUserSessionId:
      name: x-auditInfo-endUserSessionId
      in: header
      description: ID of the end user session.
      required: false
      schema:
        maxLength: 50
        minLength: 1
        type: string
        example: a1ade930-6868-445c-8022-242a46ed5530
    x-traceId:
      name: x-traceId
      in: header
      description: Unique GUID for this transaction initiated by the payer.
      required: true
      schema:
        maxLength: 36
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        type: string
        example: a1ade930-6868-445c-8022-242a46ed5530
    x-instruction-priority:
      name: x-instruction-priority
      in: header
      description: <p>Specifies the priority level of the payment instruction. </p> <table></tr><tr><tr><td>Code</td><td>Name</td><td>Definition</td></tr><tr><td>UNAT </td><td>Unattended</td><td>    Priority level is unattended. </td></tr><tr><td>NORM</td><td>Normal</td><td>Priority level is normal. </td></table>
      required: true
      schema:
        type: string
        enum:
          - NORM
          - UNAT
  securitySchemes:
    x-api-key:
      name: x-api-key
      type: apiKey
      in: header
    HMACAuth:
      name: Authorization
      type: apiKey
      in: header
      description: Valid for public endpoints Only.
  headers:
    x-traceId:
      description: Unique GUID that was passed to the request in the x-traceId header.
      schema:
        maxLength: 36
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        type: string
        example: a1ade930-6868-445c-8022-242a46ed5530
security:
  - x-api-key: []
  - HMACAuth: []
