      description: Response payment status
    TransactionInfoAndStatusResponse1:
      title: TransactionInfoAndStatusResponse1
      required:
        - transaction_status
      type: object
      properties:
        original_transaction_identification:
          maxLength: 35
          minLength: 35
          type: string
          description: |-
            Original payment transaction ID.

            It will be present when a Payment response is received from BI.
          example: BANKNTSTXXXN20180511CT0000458203590
        transaction_status:
          maxLength: 4
          minLength: 4
          type: string
          description: |-
            Transaction status. Valid values: 
            - 'PDNG' (Payment is still pending i.e. in processing)
            - 'ACCP' (Payment is accepted for clearing)
            - 'RJCT' (Payment is rejected - includes reason)
            - 'ACSC' (Payment is successfully settled)
            - 'ACWC' (Payment was manually settled)
          example: ACSC
        transaction_status_reason_code:
          maxLength: 4
          minLength: 4
          type: string
          description: Payment status reason code. Only applicable if transaction_status = RJCT or PDNG
          example: AC07
        acceptance_date_time:
          type: string
          description: The date and time when the payment was settled.
          format: date-time
          example: '2018-05-11T04:12:01.198Z'
        instructed_amount:
          type: string
          description: |-
            Interbank settlement amount.

            It will be present when a Payment response is received from BI.
          example: '100.00'
        posting_flag:
          type: string
          description: Posting Status of the payment. Valid values:'PSTG'- the payment is accepted and posting expected within SLA, 'PSTY'- the payment is accepted and posting expected to be delayed, 'PSTD'- the payment is accepted and posted
          enum:
            - PSTG
            - PSTY
            - PSTD
          example: PSTG
        service_level:
          type: string
          description: Payment method indicating the NPP service under which Cuscal processed this Payment.
          minLength: 1
          maxLength: 35
          example: sct.05
        settlement_method_identification:
          allOf:
            - $ref: '#/components/schemas/SettlementMethodIdentification1'
            - maxLength: 4
              minLength: 4
              description: |-
                Cuscal settlement method. Valid values:
                - OFFU    (Off Us)
                - CCOM  (Cuscal Community)
                - ONUS   (On Us)

