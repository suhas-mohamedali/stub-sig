  '/{orgId}/payments/aliases/validate':
    post:
      tags:
        - Payment Validation
      summary: Resolve Alias
      description: |-
        This API returns the account details for the alias value registered with the Addressing Service. aliasValue is the payee PayID that is being resolved. 

        NPP requires Alias to be registered or enquired using the following format definitions, otherwise the NPP Addressing Service will reject the Alias Resolution request as invalid.

        **Telephone (TELI):** Consists of a “+” followed by the country code (from 1 to 3 characters) then a “-“ then a number between 1-9 and then any combination of numbers between 0-9. Total of up to 35 characters.
        Format pattern:

         ^\+[0-9]{1,3}-[1-9]{1,1}[0-9]{1,29}$

        **Email (EMAL):** 
        Consists of a character string with a maximum length of 256 characters in lower case. This must include the “@” symbol with leading and trailing characters and no white spaces.
        Format pattern: (MAX256 text):

         ^(?:[a-z0-9!#$%&'\*+/=?^\_\`{|}~-]+(?:\.[a-z0-9!#$%&'\*+/=?^_`{|}~-]+)\*@(?:\[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+\[a-z0-9](?:[a-z0-9-]\*[a-z0-9])?)$

        **ABN (AUBN):** Consists of a nine to eleven digit number where the first two digits are a checksum. This is assigned by the Australian Taxation Office to identify an individual Australian Business.
        Format pattern: (MIN9 - MAX11 digit): 

         ^((\d{9})|(\d{11}))$

        **Organisation (ORGN):** 
        The Identifier must include the company/organisation name and both/either the description of the business/ trade / product / campaign and/or geographic location.
        Format pattern: Maximum of 256 characters in lower case, to be drawn from the NPP Character Set and without leading or trailing whitespace.

        ^\S[a-z0-9!\\"#$%&'()\*+,.\/:;<=>?@\[\] ^_`{|}~-]*\S$

        If the PayID is resolved, there is no obligation on the Registering Account servicer to accept the payment. If an account is closed, the registering account servicer must de-register the PayID associated with the account. In the absence of de-registeration, the PayID will still be resolved. 
      operationId: post-orgId-alias-resolve
      parameters:
        - name: orgId
          in: path
          description: |-
            orgId is the BIC11 of the institution sending the request.

            [MaxLength=11]
            [pattern=^[A-Z0-9]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$]
          required: true
          style: simple
          schema:
            maxLength: 11
            type: string
            pattern: '^[A-Z0-9]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$'
