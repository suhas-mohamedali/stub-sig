      description: |-
        Contains details of the ultimate debtor in an international transaction. This block captures the original source party responsible for the payment, which may differ from the immediate debtor. It is required for compliance and transparency in cross-border payments.
        Following fields are mandatory: name.
        Fields from these two groups must not be mixed. 
        Either (organisation_identification or organisation_identification and organisation_bic) or (private_identification, or private_identification and date_place_of_birth) must be present.

        Other fields can be populated if available in the source.
