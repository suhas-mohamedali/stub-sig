  '/{orgId}/instructions/{pmtIdInstrId}':
    post:
      tags:
        - Payment Payer
      summary: Receive Payment Initiation (RAPAIN)
      description: |-
        The purpose of this operation is to deliver mandate payment initiation requests (PAIN.001 or PAIN.013 messages) received from Initiator/Creditor participants. 

         Cuscal will process the request and provide initial response (PAIN.002 or PAIN.014) to Initiator participant. Initial response status is included in the request body of this operation. 

         When transaction was accepted by Cuscal, Payer client is required to validate the request and if payment is rejected by client, reject reason must be included in response. When request is accepted, payer client must invoke Make A Payment (MAP) service to transfer the payment to creditor party. Response to this API must be sent once successful acknowledgment is returned by MAP service. 

         If the transaction was rejected by Cuscal, payer client must not initiate payment transfer.

         - Cuscal Developer Hub Notes - Refer to the below notes when triggering API request via CuscalDeveloperHub API Explorer or directly to Sandbox endpoint:_
         - Use 'NPP-Triggers' API in API Explorer or Sandbox. Response from trigger operation will be sample request body that would be sent from Cuscal to client's Notification API.
      operationId: orgId-post-instructions
      parameters:
        - name: x-traceId
          in: header
          description: Unique GUID that was passed to the request in the x-traceId header
          required: true
          style: simple
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            example: 4323b85f-a7cb-49ba-acfb-03abc7e07fb0
        - name: orgId
          in: path
          description: This is the BIC11 identifier of the client receiving the request.
          required: true
          style: simple
          schema:
            type: string
            pattern: '^[A-Z0-9]{4,4}[A-Z]{2,2}[A-Z0-9]{2,2}[A-Z0-9]{3,3}$'
            example: BANKNTSTXXX
        - name: pmtIdInstrId
          in: path
          description: 'Unique identification as assigned by an instructing party to unambiguously identify the payment instruction. <p>A unique Payment Transaction Identifier generated by the sending client. The payment identifier must follow the following fixed character pattern NPP guidelines: </p><p>1 to 11 clients BIC11 </p><p> 12 fixed value ''I'' </p><p> 13 to 20 YYYYMMDD </p><p> 21 to 22 fixed value ''00'' </p><p> 23 to 34 sequence number starting from 000000000001 </p><p> 35 retry counter, always set to 0 unless its a retry, retries start at 1. </p>'
          required: true
          style: simple
          schema:
            type: string
            minLength: 1
            maxLength: 35
            example: BANKNTSTXXXI20180501000000000000010
      requestBody:
        description: Mandate payment initiation request
        required: false
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MandatePaymentInitiationRequest1'
                - description: Mandate payment initiation request
      responses:
        '200':
          description: |-
            OK 

             Cuscal will attempt to resend a notification if the client’s service endpoint does not respond for any reason. Hence, the client’s service endpoint should ignore any duplicate notifications, without returning an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandatePaymentInitiationResponse1'
          headers:
            x-traceId:
              schema: {}
              description: Unique GUID that was passed to the request in the x-traceId header
        '400':
          description: <p>Bad Request</p>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '401':
          description: Not Authorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
