eason</td></tr><tr><td>SL01</td><td>Specific Service offered by Debtor Agent</td><td>Due to specific service offered by the Debtor Agent</td></tr><tr><td>SL11</td><td>Creditor not on Whitelist of Debtor</td><td>The Creditor did not appear on the Debtors whitelist</td></tr><tr><td>SL12</td><td>Creditor on Blacklist of Debtor</td><td>The Creditor did appear on the Debtors blacklist</td></tr><tr><td>SL13</td><td>Maximum number of Direct Debit Transactions exceeded</td><td>The NPP Payment Initiation Request was rejected because the number of transactions requested exceeds the Debtor Agent offering.</td></tr><tr><td>SL14</td><td>Maximum Direct Debit Transaction Amount exceeded</td><td>The NPP Payment Initiation Request was rejected because the total value of transactions requested exceeds the Debtor Agent offering.</td></tr></table>
      example: ACCP
