openapi: 3.0.0
info:
  version: 4.0.3
  title: NPP Payments Notification
  description: |-
    This document represents the Technical Interface Specification for the Cuscal NPP Payments Notification API. 

    This API exposes functionality to:

    **Payments**
    * Receive Payment and Clearing Request: The purpose of this operation is to deliver payments received from payer participants.
    * Receive IFTI Payment and Clearing Request: The purpose of this operation is to deliver IFTI payments received from payer participants.
    * Receive RTRF:  The purpose of this operation is to deliver Requests to Return Funds.
    * Receive Payment Status: The purpose of this operation is to provide the status of payment.

    **Payment Initiation**
    * Receive Payment Initiation Status: The purpose of this operation is to provide the Initial and Final Status of Payment Initiation Request (MAPAIN).

    **Payment Payer**
    * Receive Payment Initiation (RAPAIN): The purpose of this operation is to deliver Mandate Payment Initiation Requests received from Initiator/Creditor participants.
    
    **Changes in v4.0.3**
    
     This release introduces the following updates:

    - Removed pattern validation for payroll_payment_date field in Receive Payment and Receive Clearing Request webhook endpoint.
    - Removed redundant/undefined fields - settlement_method and account_identification_issuers from the required attributes list in Receive IFTI Payment and IFTI Clearing Requests endpoint.
    - Added service_level(optional) attribute in Receive RTRF webhook endpoint which will indicate the service level of the original payment.
    
    **Changes in v4.0.2**
    
    This release introduces the following updates:
    
    - Added payroll_payment_date (optional) to Receive Payment Initiation (RAPAIN) endpoint.
    - Added account_identification_issuer (optional) for overseas debtor accounts within ifti_information in Receive IFTI Payment endpoint.
    - Updated length for account_identification in debtor_information for Receive IFTI Payment endpoint.
    - Updated minor descriptions/guidances for fields including unique_superannuation_code, unique_superannuation_identification, merchant_category_code, batch_identification, and number_of_transactions.
    - Updated pattern validation for payroll_payment_date field.

    **Changes in v4.0.1**

    This release introduces non‑breaking enhancements with no new or removed endpoints. Version 4.0.1 improves posting outcome transparency through the addition of an optional posting status indicator, extends mandate purpose codes to support December initiatives, and refines IFTI notification schemas, validations, and documentation for improved consistency and clarity, with no impact to existing notification subscriptions.

    _For a comprehensive view of all updates introduced in v4.0.1, please refer to the attached **OAS 4.0.1 Change Log.pdf** file included in the OAS pack._
    
    **Changes in v4.0.0**

    **Payments**:
    - New Operation:
      - Receive IFTI Payment and Clearing Request is the new Webhook introduced to deliver IFTI payments and clearing requests.
    - Operation enhancement: 
      - Receive Payment is now enhanced to deliver Clearing Requests (CR) and Clearing Notifications for subscribed clients along with Payments and Returns.
    - Field level updates (Receive Payment):
       - payment_information block updated to include payroll_payment_date, applicable for Superannuation payments.
       - sanctions_information block updated to include richer address data (optional) - bldg_name, floor, post_box, room, town_location, district_name.
       - payment_return_request_information block updated for return_additional_information occurrences changed from 3 to 10.
       - debtor_information block updated to include account_alias_type_code and account_alias_identification
       - creditor_information block updated to include merchant_category_code and ultimate_party_merchant_category_code. 
       - mandate_information block added to provide mandate payment frequency, amount type, etc.
       - transaction_status_information block updated to include two new status indicators - PDNG (revised to CLRG) status for clearing requests and ACCP for clearing notifications.
       - batch_identification block added to provide batch identifier where applicable.

    - Field level updates (Receive a RTRF): 
       - payment_return_request_information block changes: return_additional_information occurrences changed from 3 to 10.
       
       
    **Payment Initiation**:
    - New Operation: 
        - Receive Payment Initiation Status added to provide the status of Initiation requests.

    **Payment Payer**:

     - Field level updates (Receive RAPAIN):
        - creditor_information block updated to include merchant_category_code and ultimate_party_merchant_category_code.
        - New block created for batch_information and new fields batch_identification, number_of_transactions, batch_amount and batch_id_expiry added.

    **API Design and Standardisation**: 
    - **Unified Specification:**
      - All Payment and Payment Initiation Webhooks are consolidated into a single unified specification for streamlined integration.

     In case where payment outcome is not delivered, Cuscal will use Store and Forward (SAF) mechanism to SAF the messages and redeliver at later time. UnSAF jobs runs every 15 mins and will attempt to Redeliver the messages based on Client settings, once all retries are exhausted messages will be marked as UnDelivered.
