            - type: string
              description: Creditor's account's scheme
              minLength: 4
              maxLength: 4
        account_identification_issuer:
          type: string
          description: Debtor account issuer i.e. the BSB. Please note leading zeros must be included
          minLength: 6
          maxLength: 6
          example: '061245'
        account_alias_identification:
          type: string
          description: PayID Identifier. Only used when payment is addressed to a PayID. The PayID must be resolved before initiating the payment.
          maxLength: 140
          example: mrsmith@hotmailtest.com
        account_alias_type_code:
          allOf:
            - $ref: '#/components/schemas/AccountAliasType1Code'
            - type: string
              description: |-
                PayID Type. Only used when payment is addressed to a PayID. Valid Values: 
                - 'TELI' (Telephone number)
                - 'EMAL' (Email address)
                - 'AUBN' (Australian Business Number)
                - 'ORGN' (Organisation Name)
              minLength: 4
              maxLength: 4
    PaymentStatusReportResponse1:
      type: object
      title: PaymentStatusReportResponse1
      description: Response payment status
      properties:
        transaction_status_information:
          $ref: '#/components/schemas/TransactionInfoAndStatusResponse1'
      required:
        - transaction_status_information
    TransactionInfoAndStatusResponse1:
      type: object
      title: TransactionInfoAndStatusResponse1
      properties:
        original_transaction_identification:
          type: string
          description: |-
            Original payment transaction ID.

            It will be present when a Payment response is received from BI.
          minLength: 35
          maxLength: 35
          example: BANKNTSTXXXN20180511CT0000458203590
        transaction_status:
          type: string
          description: |-
            Transaction status. Valid values: 
            - 'PDNG' (Payment is in pending state - includes reason)
            - 'RJCT' (Payment is rejected - includes reason)
            - 'ACCP' (Payment is accepted for clearing)
            - 'ACSC' (Payment is successfully settled)
            - 'ACWC' (Payment was manually settled)
          minLength: 4
          maxLength: 4
          example: ACSC
        transaction_status_reason_code:
          type: string
          description: Payment status reason code. Only applicable if transaction_status = RJCT or PDNG
          minLength: 4
          maxLength: 4
          example: AC07
        acceptance_date_time:
          type: string
          description: The date and time when the payment was settled.
          format: date-time
          example: '2018-05-11T04:12:01.198Z'
        instructed_amount:
          type: string
          description: |-
            Interbank settlement amount.

            It will be present when a Payment response is received from BI.
          example: '100.00'
        posting_flag:
          type: string
          description: Posting Status of the payment. Valid values:'PSTG'- the payment is accepted and posting expected within SLA, 'PSTY'- the payment is accepted and posting expected to be delayed, 'PSTD'- the payment is accepted and posted
          enum:
            - PSTG
            - PSTY
            - PSTD
          example: PSTG
        service_level:
          allOf:
            - $ref: '#/components/schemas/ServiceLevel1'
            - description: Payment method indicating the NPP service under which the payment is being processed. For example sct.05, catsct.02 etc.
        settlement_method_identification:
          allOf:
            - $ref: '#/components/schemas/SettlementMethodIdentification1'
            - type: string
              description: |-
                Cuscal settlement method. Valid values:
                - OFFU    (Off Us)
                - CCOM  (Cuscal Community)
                - ONUS   (On Us)

                It will be present when a Payment response is received from BI.
              minLength: 4
              maxLength: 4
      required:
        - transaction_status
    MandatePaymentStatusReportRequest1:
      type: object
      x-stoplight:
        id: ccji948rp8fum
      title: MandatePaymentStatusReportRequest1
      required:
        - transaction_status
      properties:
        original_instruction_identification:
          type: string
          minLength: 1
          maxLength: 35
          example: BANKNTSTXXXI20180501000000000000010
          description: |-
            A unique Payment Instruction Identifier generated by the sending client. The payment identifier must follow the following fixed character pattern NPP guidelines. 

            Derive from pain.001/pain.013. Guidance below:

            1 to 11 : clients BIC11

            12 : fixed value 'I'

            13 to 20 : YYYYMMDD

            21 to 22 : fixed value '00'

            23 to 34 : sequence number starting from 000000000001

            35 : retry counter, always set to 0 unless it's a retry, retries start at 1.
        original_batch_identification:
          type: string
          minLength: 1
          maxLength: 35
          description: |-
            Unique identification, as assigned by the original sending party, to unambiguously identify the original payment information group.

            Derive from pain.001/pain.013. Guidance below
            When payment is part of a batch, populate with the Batch ID using the following construct:
            35 characters: 
            [BIC of Sender] [Fixed value of ‘B’] [Date][Sequence Number which may be initialised at the start of the day]
            Else: 
            Same as InstrId
          example: CUSCAU2SXXXB20251202002121346640010
        transaction_status:
          minLength: 4
          maxLength: 4
          description: "NPP: One of the following codes must be used:\r\n1. **ACCP** = AcceptedCustomerProfile\r\n2. **ACSC** = AcceptedSettlementCompleted\r\n3. **ACSP** = AcceptedSettlementInProcess\r\n4. **RJCT** = Rejected\r\n\r\nPopulated with the transaction status assigned by the Participant from whom the status is being reported. Either Responding Participant, Payer Participant, Payee Participant or FSS."
          example: ACSC
        transaction_status_reason_code:
          type: string
          description: Payment rejection reason code. Only applicable if transaction_status = RJCT
          minLength: 4
          maxLength: 4
          example: AC07
        acceptance_date_time:
          type: string
          description: The date and time when the instruction was completed.
          format: date-time
          example: '2018-05-11T04:12:01.198Z'
        instructed_amount:
          type: string
          description: Interbank settlement amount.
          example: '100.00'
          pattern: '^(?=.{1,19}$)[0-9]{0,18}(?:\.[0-9]{0,2})?$'
          maxLength: 34
        transaction_identification:
          type: string
          x-stoplight:
            id: m12ndxfor58x6
          minLength: 35
          maxLength: 35
          example: BANKNTSTXXXN20180511CT0000458203590
          description: "Original Payment Transaction ID.\r\nIt will be present if it's a Final PSR"
        mandate_identification:
          type: string
          x-stoplight:
            id: 61nqwi9vzk9v7
          example: f045c1a0beca11f0add189a0e6d567gt
          minLength: 1
          maxLength: 35
          description: 'Unique identification, as assigned by the creditor, to unambiguously identify the mandate. This will be derived from original MPIR.'
      description: Encapsulates payment data for Clearing Request
    MandatePaymentInitiationRequest1:
      type: object
      title: MandatePaymentInitiationRequest1
      description: |-
        Mandate payment initiation request along with mandate details 
         
        **Property descriptions**: 
         - **payment_information** - Payment Information. Payment initiation request information.
         - **debtor_information** - Debtor Information. Information concerning debtor/payer party of the mandate payment. 
         - **creditor_information** - Creditor Information. Information concerning creditor/payee party of the mandate payment. 
         - **mandate_information** - Mandate Related Information 
         - **transaction_status_information** - Transaction Information and Status. Status of Cuscal's initial response to the payment initiation request.
         - **batch_information** - Batch Information to enable the various Batch Booking and Transaction Grouping identifier elements to facilitate the grouping of transactions for further processing. These identifiers are proposed to support Participants in their end to- end solutions by enabling the ability to group payments and report transactions individually or consolidated.
      required:
        - payment_information
        - debtor_information
        - creditor_information
        - mandate_information
        - transaction_status_information
      properties:
        payment_information:
          allOf:
            - $ref: '#/components/schemas/MandatePaymentInitiationInformation1'
            - description: |-
                Mandate payment initiation information. 
                 
                **Property descriptions**: 
                 - **creation_date_time** - Creation Date Time. Date and time at which the message was created,UTC expressed without offset, i.e. YYYY-MM-DDThh:mm:ss.sssZ.
                 - **instruction_identification** - Payment Identification Instruction Identification. Unique identification as assigned by an instructing party to unambiguously identify the payment instruction.
                 - **instruction_priority** - Payment Type Information Instruction Priority. Indicator of the urgency or order of importance that the instructing party would like the instructed party to apply to the processing of the instruction. 
                 - **instructed_amount** - Amount Instructed Amount. Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.
                 - **service_level** - Payment Type Information Service Level Proprietary. Specifies a pre-agreed service or level of service between the parties, as a proprietary code. Specifies a NPP Back office service identification including the version.
                 - **end_to_end_identification** -Payment Identification End To End Identification. Unique identification assigned by the initiating party to unambiguously identify the transaction.This identification is passed on,unchanged,throughout the entire end-to-end chain.
                 - **remittance_information_unstructured** - Remittance Information Unstructured. Information supplied to enable the matching/reconciliation of an entry with the items that the payment is intended to settle, such as commercial invoices in an accounts' receivable system, in an unstructured form. 
                 - **charge_bearer** -Charge Bearer. Specifies which party/parties will bear the charges associated with the processing of the payment transaction. 
                 - **payment_purpose_code** - Payment Type Information Category Purpose Code. Underlying reason for the payment transaction.
                 - **category_purpose_code** - Specifies the high level purpose of the mandate based on a set of pre-defined categories. 
                 - **unique_superannuation_code** - Specifies the Name of the Identification scheme, in a free text form. For category_purpose_code = PENS, comments relating to USI - code indicating the identifier to whom the superannuation fund will be provided in this field. 
                 - **unique_superannuation_identification** - Specifies the Identification assigned by an institution. For category_purpose_code = PENS, comments relating to USI - the USI number for the superannuation fund will be provided in this field.
        debtor_information:
          allOf:
            - $ref: '#/components/schemas/MandatePaymentDebtorInformation1'
            - description: |-
                Mandate payment debtor party information. 
                 
                **Property descriptions**: 
                 - **party_name** - Debtor Name. Name of the Debtor party.
                 - **ultimate_party_name** - Ultimate Debtor Name. Name by which the ultimate debtor party is known and which is usually used to identify that party.
                 - **account_servicer_bic** - Debtor Agent Financial Institution Identification BICFI. Financial institution servicing an account for the debtor party.
                 - **account_identification_type_code** - Debtor Account Identification Other Scheme Name Code. Debtor account identification type, in a coded form: 
                   - BBAN - Basic Bank Account Number 
                   - ALIA - Alias Identification .
                 - **account_identification** -Debtor Account Identification Other Identification. Unique and unambiguous identification of the debtor account between the account owner and the account servicer. Account number with BSB prefix.
                 - **account_identification_issuer** - Debtor Account Identification Other Issuer. Entity or classification under which the identification is assigned. For example: 
                   - 6 digit BSB (BankState-Branch) number .
                 - **account_alias_type_code** - Debtor Account Proxy Type Proprietary. Debtor alias type, in a coded form as published in an external list. For example: 
                 TELE - Telephone Number 
                 EMAL - Email Address. 
                 - **account_alias_identification** - Debtor Account Proxy Identification. Debtor alias identification, used to indicate the debtor account identification under another specified name. 
                 - **full_legal_account_name** - Debtor Account Name. Name of the debtor account holder.
        creditor_information:
          allOf:
            - $ref: '#/components/schemas/MandatePaymentCreditorInformation1'
            - description: |-
                Mandate payment credit transfer transaction information. 
                 
                **Property descriptions**: 
                 - **party_name** - Creditor Name. Name by which creditor party is known and which is usually used to identify that party.
                 - **ultimate_party_name** - Ultimate creditor party to which an amount of money is due.
                 - **account_servicer_bic** - Creditor Agent Financial Institution Identification BICFI. Financial institution servicing an account for the creditor party.
                 - **account_identification_type_code** - Creditor Account Identification Other Scheme Name Code. Creditor account identification type, in a coded form: 
                   - BBAN - Basic Bank Account Number 
                   - ALIA - Alias Identification 
                 - **account_identification** - Creditor Account Identification Other Identification. Unambiguous identification of the account of the creditor to which a credit entry will be posted as a result of the payment transaction.
                 - **account_identification_issuer** - Creditor Account Identification Other Issuer. Entity or classification under which the identification is assigned. For example: 
                   - 6 digit BSB (BankState-Branch) number.
                 - **account_alias_type_code** - Creditor Alias Type, in a coded form as published in an external list. For example: 
                 TELE - Telephone Number 
                 EMAL - Email Address 
                 - **account_alias_identification** - Creditor Account Proxy Identification. Identification used to indicate the Creditor account identification under another specified name.
                 - **full_legal_account_name** - Creditor Account Name. Name of the creditor account holder.
                 - **party_reference** - Remittance Information Structured Creditor. Unique reference, as assigned by the creditor, to unambiguously refer to the payment transaction.
        mandate_information:
          allOf:
            - $ref: '#/components/schemas/MandateRelatedInformation1'
            - description: |-
                Information on the mandate associated with the payment request. 
                 
                **Property descriptions**: 
                 - **initiating_party_servicer_bic** - Forwarding Agent Financial Institution BICFI. Payment Initiator institution BIC.
                 - **initiating_party_name** - Initiating Party Name. The party that initiates the credit transfer on behalf of the debtor.
                 - **mandate_identification** - ID of mandate related to payment instruction.
                 - **mandate_verification_date_time** - Date on which the credit transfer mandate has been verified. 
                 - **establishment_scheme** - Identifies the arrangement (unilateral or bilateral) and party that established the mandate.
                 - **mandate_payment_information** - Payment information from the mandate data.
        transaction_status_information:
          allOf:
            - $ref: '#/components/schemas/MandatePaymentInitialReponseStatus1'
            - description: |-
                Details of initial response to mandate payment request by Cuscal. 
                 
                **Property descriptions**: 
                 - **transaction_status** - Transaction Status. One of the following codes will be present: 
                   - ACCP - Accepted by Cuscal 
                   - RJCT - Rejected by Cuscal.
                 - **transaction_status_reason_code** - Status Reason Information Reason Code. Reject reason code, defining the reason for the transaction status.
        batch_information:
          $ref: '#/components/schemas/MandatePaymentBatchInformation1'
    MandatePaymentBatchInformation1:
      type: object
      title: MandatePaymentBatchInformation1
      description: <p>Mandate payment batch information.</p>
      required:
        - batch_identification
      properties:
        batch_identification:
          type: string
          description: 'Unique identification, as assigned by a sending party, to unambiguously identify the payment information group within the message. When payment is part of a batch, populate with the Batch ID using the following construct: 
            35 characters: 
            It must be unique across the NPP Basic Infrastructure:
              1 - 11 BIC of FI that created the Instruction ID [11]
              12 - 12 Fixed value of B
              13 - 20 YYYYMMDD - Message Creation Date [8]
              21 - 22 Channel/Processing System Identification [2]
              23 - 34 Number [12] which may be initialised at the start of each day
              35 - 35 Retry counter [1], alphanumeric 0 to 9, A to Z. 
              Set at 0 for the first message of a business transaction, increment to the next character on each retry. 
              The values for Channel Identification (XX) are NPP Participant determined and may be used to identify separate channels such as:
                00 - Default value (only one single channel)
                Or for example (multiple channels),
                01 - Internet Banking
                02 - Mobile Banking
                03 - Cash Management
                04 - Treasury
                - 05 - ATM
                - XX - SWIFT PAG
                etc'
          minLength: 1
          maxLength: 35
          example: CUSCAU2SXXXB20251202002121346640010
        batch_booking_indicator:
          type: boolean
          description: 'Indicator to determine whether a batch or individual booking is to be made on the debit side, true – Report as a single consolidate debit amount, false – Report as individual debit transactions.'
          example: false
        number_of_transactions:
          type: string
          maxLength: 15
          pattern: '[0-9]{1,15}'
          example: '20'
          description: 'Number of individual transactions contained in the payment information group. Mandatory where batch_booking_indicator is set to true.'
        batch_amount:
          type: string
          maxLength: 34
          pattern: '^(?=.{1,19}$)[0-9]{0,18}(?:\.[0-9]{0,2})?$'
          example: '100.00'
          description: 'Total of all individual amounts included in the group, irrespective of currencies. Mandatory where batch_booking_indicator is set to true.'
        batch_id_expiry:
          type: string
          description: 'Date and time in UTC format example  YYYY-MM-DDThh:mm:ss.sssZ, Mandatory where batch_booking_indicator is set to true.'
          format: date-time
          example: '2025-05-11T04:13:41.667Z'
    MandatePaymentInitiationInformation1:
      type: object
      title: MandatePaymentInitiationInformation1
      description: |-
        Mandate payment initiation information. 
         
        **Property descriptions**: 
         - **creation_date_time** - Creation Date Time. Date and time at which the message was created,UTC expressed without offset, i.e. YYYY-MM-DDThh:mm:ss.sssZ.
         - **instruction_identification** - Payment Identification Instruction Identification. Unique identification as assigned by an instructing party to unambiguously identify the payment instruction.
         - **instruction_priority** - Payment Type Information Instruction Priority. Indicator of the urgency or order of importance that the instructing party would like the instructed party to apply to the processing of the instruction. 
         - **instructed_amount** - Amount Instructed Amount. Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.
         - **service_level** - Payment Type Information Service Level Proprietary. Specifies a pre-agreed service or level of service between the parties, as a proprietary code. Specifies a NPP Back office service identification including the version.
         - **end_to_end_identification** -Payment Identification End To End Identification. Unique identification assigned by the initiating party to unambiguously identify the transaction.This identification is passed on,unchanged,throughout the entire end-to-end chain.
         - **remittance_information_unstructured** - Remittance Information Unstructured. Information supplied to enable the matching/reconciliation of an entry with the items that the payment is intended to settle, such as commercial invoices in an accounts' receivable system, in an unstructured form. 
         - **charge_bearer** -Charge Bearer. Specifies which party/parties will bear the charges associated with the processing of the payment transaction. 
         - **payment_purpose_code** - Payment Type Information Category Purpose Code. Underlying reason for the payment transaction.
         - **category_purpose_code** - Specifies the high level purpose of the mandate based on a set of pre-defined categories. 
         - **unique_superannuation_code** - Specifies the Name of the Identification scheme, in a free text form. For category_purpose_code = PENS, comments relating to USI - code indicating the identifier to whom the superannuation fund will be provided in this field. 
         - **unique_superannuation_identification** - Specifies the Identification assigned by an institution. For category_purpose_code = PENS, comments relating to USI - the USI number for the superannuation fund will be provided in this field.
      properties:
        creation_date_time:
          type: string
          description: An ISODateTime whereby all timezoned dateTime values are UTC.
          pattern: '^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]{1,3})?(?:Z)$'
          example: '2023-08-28T07:17:38.994Z'
        instruction_identification:
          type: string
          description: |-
            A unique Payment Transaction Identifier generated by the sending client. The payment identifier must follow the following fixed character pattern NPP guidelines: 

             1 to 11 clients BIC11 
             12 fixed value 'I' 
             13 to 20 YYYYMMDD 
             21 to 22 fixed value '00' 
             23 to 34 sequence number starting from 000000000001 
             35 retry counter, always set to 0 unless it's a retry, retries start at 1.
          minLength: 1
          maxLength: 35
          example: BANKNTSTXXXI20180501000000000000010
        instruction_priority:
          allOf:
            - $ref: '#/components/schemas/Priority2Code'
            - description: <p>Specifies the priority level of an event. </p> <table></tr><tr><tr><td>Code</td><td>Name</td><td>Definition</td></tr><tr><td>UNAT </td><td>Unattended</td><td>    Priority level is unattended. </td></tr><tr><td>NORM</td><td>Normal</td><td>Priority level is normal. </td></table>
        instructed_amount:
          type: string
          pattern: '^(?=.{1,19}$)[0-9]{0,18}(?:\.[0-9]{0,2})?$'
          minLength: 1
          maxLength: 34
          example: '30'
        service_level:
          type: string
          description: Specifies a character string with a maximum length of 35 characters.
          minLength: 1
          maxLength: 35
          example: sct.05
        end_to_end_identification:
          type: string
          description: Specifies a character string with a maximum length of 35 characters.
          minLength: 1
          maxLength: 35
          example: ABC/4562/2020-09-30
        remittance_information_unstructured:
          type: string
          description: Specifies a character string with a maximum length of 280 characters.
          minLength: 1
          maxLength: 280
          example: remittance_information
        charge_bearer:
          allOf:
            - $ref: '#/components/schemas/ChargeBearerType1Code'
            - description: |-
                <p>Specifies which party(ies) will pay charges due for processing of the instruction.</p><table><tr><td>Code</td><td>Description</td></tr><tr><td>CRED</td><td>All transaction charges are to be borne by the creditor.<tr><td>DEBT</td><td>All transaction charges are to be borne by the debtor.<tr><td>SHAR </td><td>Shared In a credit transfer context, 
                 means that transaction charges on the sender side are to be borne by the debtor,
                 transaction charges on the receiver side are to be borne by the creditor. 
                 In a direct debit context, means that transaction charges on the sender side are to be borne by the creditor,
                 transaction charges on the receiver side are to be borne by the debtor.<tr><td>SLEV </td><td>Service Level Charges are to be applied following the 
                 rules agreed in the service level and/or scheme.</tr></table>
        payment_purpose_code:
          allOf:
            - $ref: '#/components/schemas/MandatePurpose1Code'
            - description: <p>Specifies the high-level purpose of the mandate based on a set of pre-defined categories.</p> <table> <tr><th>Code</th><th>Description</th></tr> <tr><td>MORT*</td><td>Mortgage Payments</td></tr> <tr><td>UTIL*</td><td>Utility Payments</td></tr> <tr><td>LOAN</td><td>Loan Payments</td></tr> <tr><td>DEPD</td><td>Dependant Support Payments</td></tr><tr><td>GAMP*</td><td>Gambling Payments</td></tr> <tr><td>RETL</td><td>Retail Payments</td></tr> <tr><td>SALA</td><td>Salary Payments</td></tr> <tr><td>PERS</td><td>Personal Payment</td></tr> <tr><td>GOVT</td><td>Government Payments</td></tr> <tr><td>PENS</td><td>Pension Payments</td></tr> <tr><td>TAXS</td><td>Tax Payments</td></tr> <tr><td>HLRP^</td><td>Property Loan Repayment</td></tr> <tr><td>UBIL^</td><td>Utility Payments</td></tr> <tr><td>GAMB^</td><td>Gambling Payments</td></tr> <tr><td>REFU^</td><td>Refund Payments</td></tr> <tr><td>OTHR</td><td>Other Service Payments</td></tr> </table> *ISO non-compliant code; Post the Compliance Date of 03 December 2027, Initiating Participants will not be able to create Mandates with Non-compliant ISO purpose codes. ^ISO compliant codes introduced as part of Release 10.
        category_purpose_code:
          allOf:
            - $ref: '#/components/schemas/CategoryPurpose1Code'
            - description: <p>Specifies the high level purpose of the mandate based on a set of pre-defined categories </p> <table><tr><td>Code</td><td>Description</td></tr><tr><td>SALA</td><td>Salary Payments</td></tr><tr><td>PENS</td><td>Pension Payments</td></tr><tr><td>TAXS</td><td>Tax Payments</td></tr></table>
        unique_superannuation_code:
          type: string
          description: Specifies a character string with a maximum length of 35 ASCII printable characters. Must provide the value as USI for the unique_superannuation_code.
          pattern: '^[ -~]{1,35}$'
          example: USI
        unique_superannuation_identification:
          type: string
          description: Specifies a character string with a maximum length of 35 ASCII printable characters.
          pattern: '^[ -~]{1,35}$'
          example: '60905115063003, STA0100AU'
        payroll_payment_date:
          type: string
          example: '2024-12-14'
          description: 'When Category Purpose Code is ''PENS'' and where the payment is for a super contribution or refund payment, this field will be populated with the payroll payment date. ''YYYY-MM-DD'' as local date.'
      required:
        - creation_date_time
        - instruction_identification
        - instruction_priority
        - instructed_amount
        - end_to_end_identification
        - charge_bearer
        - payment_purpose_code
