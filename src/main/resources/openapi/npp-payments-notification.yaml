components:
  schemas:
    ReceivePaymentRequest1:
      type: object
      title: ReceivePaymentRequest1
      description: Encapsulates payment data for payment initiated by the payer directly into payee's account
      properties:
        payment_information:
          allOf:
            - $ref: '#/components/schemas/PaymentInformation1'
            - description: |-
                Data object to encapsulate transaction related information within the payment object

        payment_return_information:
          $ref: '#/components/schemas/PaymentReturnInformation1'
        debtor_information:
          allOf:
            - $ref: '#/components/schemas/DebtorInformation1'
            - description: Data object for debtor Information
        creditor_information:
          allOf:
            - $ref: '#/components/schemas/CreditorInformation1'
            - description: Data object for Creditor Information
        mandate_information:
          allOf:
            - $ref: '#/components/schemas/MandateInformation1'
            - description: |-
                Data object for mandate related payments

        transaction_status_information:
          $ref: '#/components/schemas/TransactionStatusInformation1'
        sanctions_information:
          allOf:
            - $ref: '#/components/schemas/NppSanctionsData1'
            - description: 'This represents mandated Customer Data of the Payer, must be populated by NPP Participants initiating the payment.'
        batch_information:
          $ref: '#/components/schemas/BatchInformation1'
      required:
        - payment_information
        - debtor_information
        - creditor_information
        - transaction_status_information
    ReceivePaymentRequest2:
      type: object
      x-stoplight:
        id: p2xtp8n1bjz5o
      title: ReceivePaymentRequest2
      description: Encapsulates payment data for payment initiated by the payer directly into payee's account
      required:
        - payment_information
        - debtor_information
        - creditor_information
        - transaction_status_information
        - ifti_information
      properties:
        payment_information:
          allOf:
            - $ref: '#/components/schemas/PaymentInformation2'
        payment_return_information:
          $ref: '#/components/schemas/PaymentReturnInformation1'
        debtor_information:
          allOf:
            - $ref: '#/components/schemas/DebtorInformation2'
        creditor_information:
          allOf:
            - $ref: '#/components/schemas/CreditorInformation2'
        transaction_status_information:
          $ref: '#/components/schemas/TransactionStatusInformation1'
        sanctions_information:
          allOf:
            - $ref: '#/components/schemas/NppSanctionsData2'
        ifti_information:
          allOf:
            - $ref: '#/components/schemas/IftiInformation2'
    PaymentInformation1:
      type: object
      title: PaymentInformation1
      description: |-
        Data object to encapsulate transaction related information within the payment object

      properties:
        creation_date_time:
          type: string
          description: 'Message creation date and time in UTC format eg: YYYY-MM-DDThh:mm:ss.sssZ'
          format: date-time
          example: '2018-05-11T04:13:41.667Z'
        transaction_identification:
          type: string
          description: |-
            A unique Payment Transaction Identifier generated by the sending client. the payment identifier must follow the following fixed character pattern NPP guidelines:
             - 1 to 11     clients BIC11
             - 12             fixed value 'N'
             - 13 to 20   YYYYMMDD
             - 21 to 22   fixed value '00'
             - 23 to 34   sequence number starting from 000000000001
             - 35             retry counter, always set to 0 unless its a retry, retries start at 1.
          minLength: 35
          maxLength: 35
          example: BANKNTSTXXXN20180501000000000000010
        original_message_identification:
          type: string
          description: The original messageID of the incoming payment.
          minLength: 34
          maxLength: 34
          example: BANKNTSTXXX20160919000000000005102
        instruction_priority:
          allOf:
            - $ref: '#/components/schemas/InstructionPriority1'
            - description: |-
                Priority of the payment, Attended or Unattended

                Optional for an NPP IFTI payment

                Specifies the priority level. 
                CBPR+ XPath: Document/FIToFICstmrCdtTrf/CdtTrfTxInf/PmtTpInf/InstrPrty
        instructed_amount:
          type: string
          description: Instructed amount
          example: '100.00'
        service_level:
          allOf:
            - $ref: '#/components/schemas/ServiceLevel1'
            - description: Payment method indicating the NPP service under which the payment is being processed. For example sct.05, catsct.02 etc.
        end_to_end_identification:
          type: string
          description: |-
            End to End identifier, will be in the form of printable ASCII characters. This is the Debtor's (customer) reference for the Payment to be provided to Creditor (customer). 

            End to End is used as guidance text for Payer channels in the use of the Reference (EndToEndId) field. 

            If the payer populates the details in the channel, the same is passed on to the payee.  

            If the payer does not populate, the default value will apply.
          maxLength: 35
          example: ABC/4562/2018-04-08
        remittance_information_unstructured:
          type: string
          description: |-
            Unstructured remittance information supports unicode characters. 

          maxLength: 280
          example: ' 1. This is a payment for 123456 invoice number. 2. Payment Description for category_purpose_code = SALA, comments relating to specific employee information will be provided in this field.'
        payment_purpose_code:
          type: string
          description: |-
            Payment purpose.
            Download the 'External Code Sets' spreadsheet from https://www.iso20022.org/external_code_list.page and navigate to the '4-CategoryPurpose' tab for a full list of payment purpose codes.

          minLength: 4
          maxLength: 4
          example: EPAY
        category_purpose_code:
          type: string
          description: |-
            Payment Category cod: "EPAY", "SALA", "SUPP", "PENS", "TAXS"

            Mandatory field for category payments. 

          minLength: 4
          maxLength: 4
          example: EPAY
        payroll_payment_date:
          type: string
          example: '2024-12-14'
          description: 'When Category Purpose Code is ''PENS'' and where the payment is for a super contribution or refund payment, this field will be populated with the payroll payment date. ''YYYY-MM-DD'' as local date.'
        unique_superannuation_code:
          type: string
          description: 'For category_purpose_code = PENS, comments relating to USI code indicating the identifier to whom the superannuation fund will be provided in this field. Must provide the value as USI for the unique_superannuation_code.'
          maxLength: 35
          example: USI
        unique_superannuation_identification:
          type: string
          description: 'For category_purpose_code = PENS, comments relating to USI. The USI number for the superannuation fund will be provided in this field.'
          maxLength: 35
          example: '60905115063003, STA0100AU'
      required:
        - creation_date_time
        - transaction_identification
        - original_message_identification
        - instruction_priority
        - instructed_amount
        - service_level
        - end_to_end_identification
    PaymentInformation2:
      type: object
      x-stoplight:
        id: o4iqpao740jvj
      title: PaymentInformation2
      description: |-
        Data object to encapsulate transaction related information within the payment object

        **Guidance on instructed_amount for IFTI payments**:
        Mandatory for an NPP IFTI payment

        The amount of funds the being settled for this Payment in AUD.  Amount must always be represented with a decimal precision of 2 decimal places, i.e. with 2 digits following the decimal point.

        In the international request message, 
        -If the settlement amount currency is AUD, same currency and amount will be populated to this field.
        -If the settlement amount currency is not AUD, amount will be converted to AUD and AUD amount and currency will be populated in this field with the original interbank settled amount  and currency copied to BSCT Instructed Amount (ifti_information.instructed_amount) and the exchange rate in BSCT Exchange Rate (ifti_information.exchange_rate).

        MT103 tag: 32A (Interbank Settled Amount)
        MT103 Additional Guidance
        -If 32A currency is AUD, same currency and amount will be populated in this field
        -If 32A currency is not AUD, 32A amount will be converted to AUD and resulting AUD currency and amount will be populated to this field 
        -32A original interbank settled amount and currency will be populated in Instructed Amount (ifti_information.instructed_amount) and the exchange rate to Exchange Rate (ifti_information.exchange_rate).

        CBPR+ path: Document/FIToFICstmrCdtTrf/CdtTrfTxInf/IntrBkSttlmAmt (CBPR+ Interbank Settlement Amount and currency)
        CBPR+ Additional Guidance
        -If CBPR+ Interbank Settlement Amount Currency is AUD, same currency and amount will be populated to this field.
        -If CBPR+ Interbank Settlement Amount Currency is not AUD, amount will be converted to AUD and resulting AUD amount and currency will be populated to this field
        -CBPR+ original interbank settled amount and currency will be Populated to Instructed Amount (ifti_information.instructed_amount) and the exchange rate to Exchange Rate (ifti_information.exchange_rate). 

        **Guidance on end_to_end_identification for IFTI payments**:
        Mandatory for an NPP IFTI payment
        It contains any information or directions provided by the payer to the payee in relation to the instruction (Here an end-to-end reference is carried forward)

        MT103 tag: 70 (Remittance Information)
        MT103 Additional Guidance
        - In order of preference, if one of code '/ROC/' or '/RFB/' or '/INV/' or '/IPI/' or '/TSU/' is present in Remittance Information, the reference that follows the code (up to 35 characters string terminated with '/' or 'CR/LF') will be copied to this field 
        - Else will be populated with "NOTPROVIDED”
        - End to End Identification is limited to ASCII Printable characters (decimal 32 to 126). If any selected character is outside this character range, it will be replaced with the character '?'

        CBPR+ Xpath : Document/FIToFICstmrCdtTrf/CdtTrfTxInf/PmtId/EndToEndId
      required:
        - creation_date_time
        - transaction_identification
        - end_to_end_identification
        - service_level
        - instructed_amount
        - instruction_priority
        - original_message_identification

      properties:
        creation_date_time:
          type: string
          description: 'Message creation date and time in UTC format eg: YYYY-MM-DDThh:mm:ss.sssZ'
          format: date-time
          example: '2018-05-11T04:13:41.667Z'
        transaction_identification:
          type: string
          description: |-
            A unique Payment Transaction Identifier generated by the sending client. the payment identifier must follow the following fixed character pattern NPP guidelines:
             - 1 to 11     clients BIC11
             - 12             fixed value 'N'
             - 13 to 20   YYYYMMDD
             - 21 to 22   fixed value '00'
             - 23 to 34   sequence number starting from 000000000001
             - 35             retry counter, always set to 0 unless its a retry, retries start at 1.
          minLength: 35
          maxLength: 35
          example: BANKNTSTXXXN20180501000000000000010
        end_to_end_identification:
          type: string
          description: |-
            End to End identifier, will be in the form of printable ASCII characters. This is the Debtor's (customer) reference for the Payment to be provided to Creditor (customer). 

            End to End is used as guidance text for Payer channels in the use of the Reference (EndToEndId) field. 

            If the payer populates the details in the channel, the same is passed on to the payee.  

            If the payer does not populate, the default value will apply.
          maxLength: 35
          example: ABC/4562/2018-04-08
        service_level:
          type: string
          description: Payment method indicating the NPP service name under which Cuscal processed this Payment.
          minLength: 1
          maxLength: 35
          example: sctxbrdr.02
        category_purpose_code:
          type: string
          description: |-
            Payment Category code: "EPAY", "SALA", "SUPP", "PENS", "TAXS"

            Mandatory field for category payments. 

            Optional field for an NPP IFTI payment. 
            Specifies the high level purpose of the instruction.
            CBPR+ XPath: Document/FIToFICstmrCdtTrf/CdtTrfTxInf/PmtTpInf/CtgyPurp/Cd
          minLength: 4
          maxLength: 4
          example: EPAY
        instructed_amount:
          type: string
          description: Instructed amount
          example: '100.00'
        interbank_settlement_date:
          type: string
          x-stoplight:
            id: fctfayow1vq6x
          description: "Date on which the amount of money ceases to be available to the agent that owes it and when the amount of money becomes available to the agent to which it is due.\r\nISODate (based on date)"
          format: date
          example: '2024-12-14'
        remittance_information_unstructured:
          type: string
          description: |-
            Unstructured remittance information supports unicode characters. 

            Mandatory for NPP IFTI payment if Present in the source international message
            Any additional information or directions provided by the offshore debtor to the creditor in relation to the instruction should be forwarded in this field.
            MT103 tag: 70 (Remittance Information)
            - MT103 Additional Guidance:
            - Field 70 (including code '/ROC/' if present) will be copied into Unstructured Remittance Info.
          maxLength: 280
          example: ' 1. This is a payment for 123456 invoice number. 2. Payment Description for category_purpose_code = SALA, comments relating to specific employee information will be provided in this field.'
        payment_purpose_code:
          type: string
          description: |-
            Payment purpose.
            Download the 'External Code Sets' spreadsheet from https://www.iso20022.org/external_code_list.page and navigate to the '4-CategoryPurpose' tab for a full list of payment purpose codes.

            Mandatory for NPP IFTI payment if Present in the source international message
            Any information given in the instruction about the reason for transferring the money must be provided here.
            CBPR+ xpath: Document/FIToFICstmrCdtTrf/CdtTrfTxInf/Purp/Cd
          minLength: 4
          maxLength: 4
          example: EPAY
        instruction_priority:
          allOf:
            - $ref: '#/components/schemas/InstructionPriority1'
            - description: |-
                Priority of the payment, Attended or Unattended

                Optional for an NPP IFTI payment

                Specifies the priority level. 
                CBPR+ XPath: Document/FIToFICstmrCdtTrf/CdtTrfTxInf/PmtTpInf/InstrPrty
          description: "Priority of the payment, Attended or Unattended.\r\nEnum:[ NORM, UNAT ]"
        original_message_identification:
          type: string
          description: The original messageID of the incoming payment.
          minLength: 34
          maxLength: 34
          example: BANKNTSTXXX20160919000000000005102
    InstructionPriority1:
      type: string
      enum:
        - NORM
        - UNAT
      title: InstructionPriority1
      description: |-
        Priority of the payment, Attended or Unattended

        Optional for an NPP IFTI payment

        Specifies the priority level. 
        CBPR+ XPath: Document/FIToFICstmrCdtTrf/CdtTrfTxInf/PmtTpInf/InstrPrty
      example: NORM
    ServiceLevel1:
      type: string
      title: ServiceLevel
      description: Payment method indicating the NPP service under which the Payment is being processed. 
      minLength: 1
      maxLength: 35
      example: sct.05
    ServiceLevelIFTI:
      type: string
      minLength: 1
      maxLength: 35
      example: SEPA
    PaymentReturnInformation1:
      type: object
      title: PaymentReturnInformation1
      properties:
        original_transaction_identification:
          type: string
          description: |-
            Original payment transaction ID.

            It will be present if a genuine response is received from BI.
          minLength: 35
          maxLength: 35
          example: BANKNTSTXXXN20180511CT0000458203590
        return_amount:
          type: string
          description: |-
            Interbank settlement amount.

            It will be present if a genuine response is received from BI.
          example: '100.00'
        return_reason_code:
          type: string
          description: 'Payment return reason code. If this field is populated, then this is a inbound payment return'
          minLength: 4
          maxLength: 4
          example: FOCR
        return_additional_information:
          type: array
          description: 'return_additional_information will be populated when the return reason codes are either NARR or FOCR. Up to 10 occurrences are permitted in the message. If return_reason_code = ''NARR'' (Narrative), at least one instance of this will be present. If return_reason_code = ''FOCR'' (Following Cancellation Request) then the cancellation request case number must be expressed in one of the instance of return_addition_information, prefixed with ''/CASE/'' starting in position .'
          maxItems: 10
          items:
            type: string
            maxLength: 105
          example:
            - CASE1234
    DebtorInformation1:
      type: object
      title: DebtorInformation1
      description: Debtor Information
      properties:
        party_name:
          type: string
          description: |-
            Name of the Debtor Account which is present in the Payer bank records as KYC verified name (may be different from the Debtor's legal name. If not provided by Payer Client, Cuscal will enrich it with Debtor FLAN value)

          maxLength: 140
          example: ABC Corporation
        ultimate_party_name:
          type: string
          description: Ultimate Debtor Name
          maxLength: 140
        account_servicer_bic:
          type: string
          description: |-
            The BIC11 of the debtor initiating the payment 

          minLength: 11
          maxLength: 11
          example: QTMBAU41XXX
        account_identification_type_code:
          allOf:
            - $ref: '#/components/schemas/AccountIdentificationType1Code'
            - type: string
              description: Debtor account scheme
              minLength: 4
              maxLength: 4
        account_identification:
          type: string
          description: |-
            Debtor account identifier i.e. BSB and Account number 

          maxLength: 34
          example: '061245125574999'
        account_identification_issuer:
          type: string
          description: Debtor account issuer i.e. the BSB. Please note leading zeros must be included
          minLength: 6
          maxLength: 6
          example: '061245'
        account_alias_type_code:
          allOf:
            - $ref: '#/components/schemas/AccountAliasType1Code'
            - maxLength: 4
              minLength: 4
              description: |-
                PayID Type. Only used when payment is addressed to a PayID. Valid Values: 
                - 'TELI' (Telephone number)
                - 'EMAL' (Email address)
                - 'AUBN' (Australian Business Number)
                - 'ORGN' (Organisation Name)
        account_alias_identification:
          maxLength: 140
          type: string
          description: PayID Identifier. Only used when payment is addressed to a PayID. The PayID must be resolved before initiating the payment.
          example: mrsmith@hotmailtest.com
        full_legal_account_name:
          type: string
          description: |-
            Debtor full legal account name as registered by the Debtor Agent. Field will be always present in RAP notification, but optional in RAPR notification.
          maxLength: 140
          example: ABC Corporation Pty Ltd
        party_type:
          allOf:
            - type: string
            - maxLength: 4
              minLength: 4
              description: >-
                Debtor account type.
                Valid values:
                - INDV (individual)
                - NIND (non-individual)
              enum:
                - INDV
                - NIND
              example: INDV
      required:
        - party_name
        - account_identification_type_code
        - account_identification
        - account_identification_issuer
    DebtorInformation2:
      type: object
      title: DebtorInformation2
      description: |-
        Contains details of the debtor for NPP domestic leg transaction. This block provides all relevant debtor attributes required for processing and compliance within the domestic leg of the payment.
        Example- "debtor_information": {
        "bicfi": "CUSCAU2SXXX",
        "account_identification": "80000812345678",}
      required:
        - party_name
        - account_identification_type_code
        - account_identification
      properties:
        party_name:
          maxLength: 140
          type: string
          description: |-
            Debtor name Debtor Agent records (may be different from the Debtor's legal name)

          example: ABC Corporation
        ultimate_party_name:
          type: string
          description: Ultimate Debtor Name
          maxLength: 140
        account_servicer_bic:
          type: string
          description: |-
            The BIC11 of the debtor initiating the payment 

          minLength: 11
          maxLength: 11
          example: QTMBAU41XXX
        account_identification_type_code:
          allOf:
            - $ref: '#/components/schemas/AccountIdentificationType1Code'
            - type: string
              description: Debtor account scheme
              minLength: 4
              maxLength: 4
        account_identification:
          type: string
          description: |-
            Debtor account identifier i.e. BSB and Account number 

          maxLength: 35
          example: '061245125574999'
        account_identification_issuer:
          type: string
          description: Debtor account issuer i.e. the BSB. Please note leading zeros must be included
          minLength: 6
          maxLength: 6
          example: '061245'
        account_alias_type_code:
          allOf:
            - $ref: '#/components/schemas/AccountAliasType1Code'
            - maxLength: 4
              minLength: 4
              description: |-
                PayID Type. Only used when payment is addressed to a PayID. Valid Values: 
                - 'TELI' (Telephone number)
                - 'EMAL' (Email address)
                - 'AUBN' (Australian Business Number)
                - 'ORGN' (Organisation Name)
        account_alias_identification:
          maxLength: 140
          type: string
          description: PayID Identifier. Only used when payment is addressed to a PayID. The PayID must be resolved before initiating the payment.
          example: mrsmith@hotmailtest.com
        full_legal_account_name:
          type: string
          description: |-
            Debtor full legal account name as registered by the Debtor Agent. Field will be always present in RAP notification, but optional in RAPR notification.
          maxLength: 140
          example: ABC Corporation Pty Ltd
        party_type:
          allOf:
            - type: string
            - maxLength: 4
              minLength: 4
              description: >-
                Debtor account type.
                Valid values:
                - INDV (individual)
                - NIND (non-individual)
              enum:
                - INDV
                - NIND
              example: INDV
    DebtorAgentInformation1:
      type: object
      x-stoplight:
        id: fsopoc8kgkgsl
      title: DebtorAgentInformation1
      properties:
        bic:
          type: string
          pattern: '[A-Z0-9]{4,4}[A-Z]{2,2}[A-Z0-9]{2,2}([A-Z0-9]{3,3}){0,1}'
          description: 'Code allocated to a financial institution by the ISO 9362 Registration Authority  as described in ISO 9362 "Banking - Banking telecommunication messages - Business identifier code (BIC)'
        lei:
          type: string
          x-stoplight:
            id: ys1l1ktenuxva
          pattern: '[A-Z0-9]{18,18}[0-9]{2,2}'
          description: 'Legal entity identifier of the financial institution.'
        name:
          type: string
          x-stoplight:
            id: q7jqtbelk0tpu
          minLength: 1
          maxLength: 140
      description: Financial institution servicing an account for the debtor used for the overseas transaction. Either BICFI or LEI must be provided. If present, both can be present.
    DebtorInformation3:
      title: DebtorInformation3
      type: object
      description: |-
        Contains details of the source/overseas debtor for international transactions. This block captures overseas debtor information required for cross-border payment processing and compliance.
        
        Example:
        "debtor_information": {
          "name": "Maria Gonzalez",
          "account_identification": "ES9121000418450200051332",
          "country": "Spain",
          "organisation_bic": "BBVAESMMXXX"
        }
      x-examples: {}
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 140
          minLength: 1
          description: Name by which a party is known and which is usually used to identify that party.
        address:
          $ref: '#/components/schemas/NppAddress2'
        country_of_residence:
          $ref: '#/components/schemas/CountryOfResidence1'
        organisation_identification:
          $ref: '#/components/schemas/GenericOrganisationIdentification1'
        organisation_bic:
          type: string
          pattern: '[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}'
          example: CUSCAU2SXXX
        private_identification:
          description: 'Unique and unambiguous identification of a person, for example a passport.'
          type: object
          properties:
            other:
              type: array
              minItems: 1
              maxItems: 3
              items:
                $ref: '#/components/schemas/GenericPersonIdentification1'
        date_place_of_birth:
          $ref: '#/components/schemas/DateAndPlaceOfBirth1'
    DebtorInformation4:
      title: DebtorInformation4
      type: object
      description: 'Unambiguous identification of the account of the debtor to which a debit entry will be made as a result of the transaction. Either one of: iban or account_identification would be present.'
      properties:
        iban:
          type: string
          description: "International Bank Account Number (IBAN) - identifier used internationally by financial institutions to uniquely identify the account of a customer. Further specifications of the format and content of the IBAN can be found in the standard ISO 13616 \"Banking and related financial services - International Bank Account Number (IBAN)\" version 1997-10-01, or later revisions.\r\nIBAN2007Identifier (based on string)\r\nidentificationScheme: National Banking Association; International Bank Account Number (ISO 13616)"
          pattern: '[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}'
        account_identification:
          type: string
          description: 'Identification assigned by an institution.\r\nThis is a general guidance for NPP participants on an IFTI payment originating from an inbound channel other than CBPR+. Guidance: If debtor account number is not present in the inbound message, populate value \"NOTPROVIDED\". IFTI Data Requirement: Must Provide if Present. Only if account_identification is not present at all, provide iban.'
          minLength: 1
          maxLength: 34
        account_identification_type_code:
          $ref: '#/components/schemas/AccountIdentificationType1Code'
        account_identification_issuer:
          maxLength: 35
          minLength: 1
          type: string
          description: |-
            Identifies the scheme or authority that issued the debtor account identification. This typically represents country-specific or international account identification standards used to interpret the account number. 
            Examples include: - 
