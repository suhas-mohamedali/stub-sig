paths:
  '/{orgId}/payments/{paymentId}':
    post:
      tags:
        - Payments
      summary: Receive Payment and Receive Clearing Request
      description: 'The purpose of this operation is to deliver payments, returns, clearing requests and clearing notifications received from payer participants.'
      operationId: post-orgId-payments-paymentId
      parameters:
        - name: x-traceId
          in: header
          description: Unique GUID for this transaction.
          required: true
          style: simple
          schema:
            type: string
            example: 5323b85f-a7cb-49ba-acfb-03abc7e07fb0
        - name: orgId
          in: path
          description: orgId is the BIC11 of the client receiving the payment instruction from Cuscal.
          required: true
          style: simple
          schema:
            type: string
            example: CUSCAU2SXXX
        - name: paymentId
          in: path
          description: |-
            Unique message identification derived by the sending client's system for this request. The message identifier must follow the following fixed character pattern NPP guidelines. 

            Refer payment_information.transaction_identification for data format.

            [MaxLength=35]
          required: true
          style: simple
          schema:
            type: string
            example: BANKNTSTXXXN20180501000000000000010
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceivePaymentRequest1'
      responses:
        '200':
          description: |-
            OK 

             Cuscal will attempt to resend a notification if the client’s service endpoint does not respond for any reason. Hence, the client’s service endpoint should ignore any duplicate notifications, without returning an error.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '401':
          description: Not Authorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
        '503':
          description: Service unavailable
          content:
