    PreviousInstructingAgent1:
      type: object
      title: PreviousInstructingAgent1
      description: |-
        Mandatory for NPP IFTI payment
        The identification of the agent, who instructs the intermediary bank / the NPP payer participant for NPP clearing, should be captured in BSCT Previous Instructing Agent.

        MT103 tag: Sender BIC
        • Inbound MT 103 Sender BIC will get populated to BIC_Identifier

        CBPR+ xpath: Document/FIToFICstmrCdtTrf/CdtTrfTxInf/InstgAgt/FinInstnId/
      properties:
