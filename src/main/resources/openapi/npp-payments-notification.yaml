  '/{orgId}/requests/returns/{paymentId}':
    post:
      tags:
        - Payments
      summary: Receive RTRF
      description: This API is designed by Cuscal to be implemented and hosted by bank prior to onboarding so that they can receive RTRFs.
      operationId: post-orgId-requests-returns-paymentId
      parameters:
        - name: x-traceId
          in: header
          description: Unique GUID for this transaction.
          required: true
          style: simple
          schema:
            type: string
            example: 5323b85f-a7cb-49ba-acfb-03abc7e07fb0
        - name: orgId
          in: path
          description: orgId is the BIC11 of the client receiving the payment instruction from Cuscal. Please note this value will be provided to you by Cuscal as part of on-boarding.
          required: true
          style: simple
          schema:
            type: string
            example: BANKNTSTXXX
        - name: paymentId
          in: path
          description: |-
            Unique message identification derived by the sending client's system for this request. The message identifier must follow the following fixed character pattern NPP guidelines:
             - 1 to 11     clients BIC11
             - 12             fixed value 'N'
             - 13 to 20   YYYYMMDD
             - 21 to 22   fixed value '00'
             - 23 to 34   sequence number starting from 000000000001
             - 35             retry counter, always set to 0 unless its a retry, retries start at 1.
          required: true
          style: simple
          schema:
            type: string
            example: BANKNTSTXXXN20180501000000000000010
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RTRFRequest1'
      responses:
        '200':
          description: |-
