          organisation_bic: BBVAESMMXXX
          identification: TAXID-ES123456
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 140
          description: Name by which a party is known and which is usually used to identify that party. This is the overseas party who have initiated the original international transaction
        address:
          $ref: '#/components/schemas/NppAddress2'
        organisation_identification:
