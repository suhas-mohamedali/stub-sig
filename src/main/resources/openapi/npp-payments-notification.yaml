    OrgCaseNTxnInfo1:
      type: object
      x-stoplight:
        id: fa0fba7ee8af4
      title: OrgCaseNTxnInfo1
      description: Required information of original case and transaction.
      properties:
        case_identification:
          type: string
          description: |-
            The unique Id assigned to the case by Cuscal's dispute system.
            If request to return fund is solicited this should be provided otherwise could be blank
          maxLength: 34
          example: TMBAAUTSE2EC2018071100000000000000
        original_message_identification:
          type: string
          description: Business message id of original transaction.
          maxLength: 34
          example: CUSCAU2SXXX20180529000000000004077
        original_end_to_end_identification:
          type: string
          description: End to End Id of the original transaction
          maxLength: 34
          example: NOTPROVIDED
        original_transaction_identification:
          type: string
          description: |-
            Transaction Id of the original transaction
            For mandate claim payment requests this field will be 'NEWPAINPACS'
          minLength: 35
          maxLength: 35
          example: TMBAAUTSE2EN20180529TM0001118209610
        returned_amount:
          type: string
          description: |-
            Amount of the original transaction

            For unsolicited should be the original amount and solicited could be less than or equal to original amount.
          example: '41.78'
        return_reason_code:
          type: string
          description: 'Reason for the return, as published in an external Reason Code list. Please refer to the Developer Guide section for further details.'
          minLength: 4
          maxLength: 4
          example: FOCR
        return_additional_information:
          type: array
          description: |-
            Up to 10 occurrences are permitted in the message. If return_reason_code = 'NARR' (Narrative), at least one instance of return_additional_information must be present. If return_reason_code = 'FOCR' (Following Cancellation Request) then the cancellation request case number must be expressed in one instance of return_additional_information, prefixed with '/CASE/' starting in position 1.

            When a NPP Payment returned is a Mandate Payment with a Mandate Id,  the associated Mandate Identification must be included as a composite field structured using a combination of the codeword "/MndtId/" + mandate identification + "/" :

            IFTI changes (applicable for solicited return)
            As return is directed to the intermediary and not to the original offshore debtor, below details will be added into the new occurrence of additional information after the first instance (/CASE/) based on the camt.056 request. 
            "/IFTI/RtrChain/Cdtr/BICFI//" + BICFI of the agent ultimately receiving the funds
            Or
            "/IFTI/RtrChain/Cdtr/AnyBIC//" + BIC of the party ultimately receiving the funds
            Or
            "/IFTI/RtrChain/Cdtr/Nm//" + Name of the party/agent ultimately receiving the
            funds
            Copy also an instance if present:-
            "/IFTI/RtrChain/UltmtCdtr/BICFI//" + BICFI of the agent as ultimate party behind
            receiving the funds
            Or
            "/IFTI/RtrChain/UltmtCdtr/AnyBIC//" + BIC of the party as ultimate party behind
            receiving the funds
            Or
            "/IFTI/RtrChain/UltmtCdtr/Nm//"+ Name of the party/agent as ultimate party behind receiving the funds
          maxItems: 10
          items:
            type: string
      required:
        - original_message_identification
        - original_end_to_end_identification
        - original_transaction_identification
        - returned_amount
        - return_reason_code
    MandateClaimInformation1:
      type: object
      x-stoplight:
        id: b120627157a05
      title: MandateClaimInformation1
      properties:
        instructed_amount:
          type: string
          description: Instructed amount
          example: '100.00'
        instruction_identification:
          type: string
          description: |-
            A unique Payment Transaction Identifier generated by the sending client. The payment identifier must follow the following fixed character pattern NPP guidelines:
            - 1 to 11 clients BIC11
            - 12 fixed value 'I'
            - 13 to 20 YYYYMMDD
            - 21 to 22 fixed value '00'
            - 23 to 34 sequence number starting from 000000000001
            - 35 retry counter, always set to 0 unless it's a retry, retries start at 1.
          minLength: 1
          maxLength: 35
          example: BANKNTSTXXXI20180501000000000000010
        mandate_identification:
          type: string
          description: 'Universally Unique IDentifier (UUID) version 1, as described in IETC RFC 4122 "Universally Unique IDentifier (UUID) URN Namespace" without the 4 hyphen separators. For example: ''00000000000010008000000000000000'' instead of ''00000000-0000-1000-8000-000000000000'' (without quotes)'
          pattern: '^[a-f0-9]{12}1[a-f0-9]{3}[89ab][a-f0-9]{15}$'
          example: adbdc0b8ff6e1362a9ed5262139e2f1a
        creditor_information:
          $ref: '#/components/schemas/ClaimCreditorInformation1'
      required:
        - instructed_amount
